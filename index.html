<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MYEL">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MYEL</title>
<style>
/* Mẫu màu Ocean. --hd-*: thanh tiêu đề. --tc*: màu của từng chủ đề (tc0/tc1/tc2 luân phiên) */
:root{--bg:#f3f7fc;--card:#fff;--text:#1a1d24;--muted:#6b7280;--line:#e1e8f0;--pri:#185FA5;--danger:#dc2626;--ok:#16a34a;--chip:#E6F1FB;--hd-bg:#E6F1FB;--hd-text:#0C447C}
.tc0,:root{--tc:#378ADD;--tc-d:#185FA5;--tc-bg:#E6F1FB;--tc-e:#185FA5}
.tc1{--tc:#1D9E75;--tc-d:#0F6E56;--tc-bg:#E1F5EE;--tc-e:#0F6E56}
.tc2{--tc:#7F77DD;--tc-d:#534AB7;--tc-bg:#EEEDFE;--tc-e:#534AB7}
@media (prefers-color-scheme:dark){
:root{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--pri:#378ADD;--danger:#f87171;--ok:#22c55e;--chip:#0C447C;--hd-bg:#042C53;--hd-text:#B5D4F4}
.tc0,:root{--tc-d:#85B7EB;--tc-bg:#0C447C}
.tc1{--tc-d:#5DCAA5;--tc-bg:#085041}
.tc2{--tc-d:#AFA9EC;--tc-bg:#3C3489}}
/* Mẫu màu Sunset */
html[data-theme=sunset]{--bg:#fcf6f3;--pri:#D85A30;--chip:#FAECE7;--hd-bg:#FAECE7;--hd-text:#712B13}
html[data-theme=sunset],html[data-theme=sunset] .tc0{--tc:#D85A30;--tc-d:#993C1D;--tc-bg:#FAECE7;--tc-e:#993C1D}
html[data-theme=sunset] .tc1{--tc:#EF9F27;--tc-d:#854F0B;--tc-bg:#FAEEDA;--tc-e:#854F0B}
html[data-theme=sunset] .tc2{--tc:#D4537E;--tc-d:#993556;--tc-bg:#FBEAF0;--tc-e:#993556}
/* Mẫu màu Lavender */
html[data-theme=lavender]{--bg:#f6f5fd;--pri:#534AB7;--chip:#EEEDFE;--hd-bg:#EEEDFE;--hd-text:#3C3489}
html[data-theme=lavender],html[data-theme=lavender] .tc0{--tc:#7F77DD;--tc-d:#534AB7;--tc-bg:#EEEDFE;--tc-e:#534AB7}
html[data-theme=lavender] .tc1{--tc:#D4537E;--tc-d:#993556;--tc-bg:#FBEAF0;--tc-e:#993556}
html[data-theme=lavender] .tc2{--tc:#1D9E75;--tc-d:#0F6E56;--tc-bg:#E1F5EE;--tc-e:#0F6E56}
@media (prefers-color-scheme:dark){
html[data-theme=sunset]{--bg:#0f1115;--pri:#D85A30;--chip:#712B13;--hd-bg:#4A1B0C;--hd-text:#F5C4B3}
html[data-theme=sunset],html[data-theme=sunset] .tc0{--tc-d:#F0997B;--tc-bg:#712B13}
html[data-theme=sunset] .tc1{--tc-d:#FAC775;--tc-bg:#633806}
html[data-theme=sunset] .tc2{--tc-d:#ED93B1;--tc-bg:#72243E}
html[data-theme=lavender]{--bg:#0f1115;--pri:#7F77DD;--chip:#3C3489;--hd-bg:#26215C;--hd-text:#CECBF6}
html[data-theme=lavender],html[data-theme=lavender] .tc0{--tc-d:#AFA9EC;--tc-bg:#3C3489}
html[data-theme=lavender] .tc1{--tc-d:#ED93B1;--tc-bg:#72243E}
html[data-theme=lavender] .tc2{--tc-d:#5DCAA5;--tc-bg:#085041}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--hd-bg);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0 4px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hd-text)}
header .icon{color:var(--hd-text)}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon{background:none;border:0;font-size:22px;min-width:40px;height:40px;border-radius:10px;color:var(--pri);padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.icon.text{font-size:17px;font-weight:600}
.icon:disabled{opacity:.4}
#back{font-size:34px;line-height:1;padding-bottom:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.block{display:block;width:100%;margin:14px 0}
.row{display:flex;gap:10px;margin:10px 0}
.grow{flex:1;min-width:0}
.list{list-style:none;margin:10px 0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:8px;padding:12px 12px;color:inherit;text-decoration:none}
.item small{display:block;color:var(--muted);font-size:14px}
.topic{gap:14px;padding:10px 12px}
.thumb{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--tc);background:#fff;object-fit:cover;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--tc-e);font-weight:700;font-size:18px;letter-spacing:.5px}
.thumb.big{width:88px;height:88px;font-size:26px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;max-width:200px}
.bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
#words>li.item,#convs>li.item{border-left:4px solid var(--tc)}
#words>li.divider{list-style:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ok);background:var(--bg)}
.imgpick{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.imgpick .btns{display:flex;flex-direction:column;gap:8px}
.chev{color:var(--muted);font-size:22px}
.pen{color:var(--muted);font-size:15px}
.ipa{color:var(--muted);font-size:14px}
.ex{font-style:italic}
.chk{font-weight:700;color:var(--muted);opacity:.3}
.chk.on{opacity:1;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;list-style:none}
input,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-top:4px}
input[type=search]{margin:4px 0 0}
label,.label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
.label{margin-bottom:0}
.bad{border-color:var(--danger)}
select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);min-width:0}
[data-say]{cursor:pointer}
.ex .spk{font-style:normal;font-size:13px;margin-right:4px;border:0;background:none;padding:0 2px 0 0;cursor:pointer}
/* Notes: từ / cụm từ được tô đỏ, chạm vào xem nghĩa. Nút "＋ Add to Notes" hiện khi bôi đen chữ */
/* Loại từ (n., v., adj. …) và dòng V2 / V3 của động từ */
.pos{display:inline-block;font-size:11px;font-weight:700;color:var(--tc-d);background:var(--tc-bg);border-radius:6px;padding:1px 6px;vertical-align:middle}
.vf{display:block;font-size:13px;color:var(--tc-d)}
.back .vf{font-size:15px;margin-top:4px}
/* Màn hình Irregular verbs: bảng kẻ ô, mỗi cột 1 màu, dòng chẵn lẻ xen kẽ.
   Tìm kiếm: tô màu các dòng khớp (.hit), dòng đang chọn (.cur) tô đậm hơn */
:root{--hit:#FFF6D6;--hit-cur:#FFE08A}
@media (prefers-color-scheme:dark){:root{--hit:#3a3218;--hit-cur:#6b5410}}
.irbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.irbar input{margin:0}
.irbar .cnt{font-size:13px;color:var(--muted);min-width:46px;text-align:center}
.irtable{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.irhead,.irrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px}
.irhead{position:sticky;top:0;z-index:1;background:var(--pri);color:#fff;font-size:12px;font-weight:700}
.irhead span{padding:8px 8px;border-right:1px solid rgba(255,255,255,.25)}
.irrow{border-bottom:1px solid var(--line);transition:background .25s}
.irrow:nth-child(odd){background:var(--bg)}
.irrow span{padding:8px 8px 2px;font-size:15px;font-weight:700;color:var(--tc-d);border-right:1px solid var(--line);cursor:pointer;word-break:break-word}
.irrow .icon{min-width:36px;height:auto;font-size:18px;grid-row:span 2}
.irrow .irvi{grid-column:1 / 4;padding:0 8px 7px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.irrow.hit{background:var(--hit)}
.irrow.cur{background:var(--hit-cur);box-shadow:inset 4px 0 0 var(--pri)}
.nt{color:var(--danger);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
#ntAdd{position:fixed;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card [data-hl]{-webkit-user-select:text;user-select:text}
.notes .ntc{color:var(--danger)}
/* Dịch câu ví dụ (Example meaning): ẩn / hiện bằng nút "Example meaning" */
.exvi{display:block;color:var(--muted);font-size:13px}
.back .exvi{font-size:14px;margin-top:4px}
.lsitem .exvi{font-size:14px}
body.hide-exvi .exvi{display:none!important}
#dlgBody p{white-space:pre-line}
/* Các màn hình chiếm vừa 1 màn hình (danh sách cuộn bên trong) */
main.fill{display:flex;flex-direction:column;padding-bottom:12px;height:calc(100vh - var(--hh,57px) - env(safe-area-inset-bottom));height:calc(100dvh - var(--hh,57px) - env(safe-area-inset-bottom))}
.tlist{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0}
.fill .block{margin:12px 0 0}
/* Màn hình tổng */
.tiles{display:grid;gap:12px;margin-bottom:14px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--tc-bg);border:1px solid var(--tc);color:var(--tc-d);text-decoration:none}
.tile .ic{width:52px;height:52px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tile b{display:block;font-size:20px}
.tile small{font-size:14px}
.tile .chev{color:var(--tc-d)}
.banner{flex:1 1 0;min-height:120px;position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .ph{position:absolute;inset:0;width:100%;border:2px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-size:15px}
/* Khung kiểu A: bo góc lớn, viền theo màu mẫu, bóng đổ nhẹ. Trình chiếu lật trang như sách + phóng to chậm */
.banner.framed{border:3px solid var(--pri);border-radius:22px;box-shadow:0 10px 26px rgba(0,0,0,.16);perspective:1400px}
.pg{position:absolute;inset:0;overflow:hidden;background:var(--card);transform-origin:left center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(0,0,0,.35),rgba(0,0,0,0) 60%);opacity:0;transition:opacity .9s}
.pg.turn{transition:transform .9s cubic-bezier(.45,.05,.35,1)}
.pg.turn::after{opacity:1}
.pg img.zoom{animation:kb 3.8s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:5}
.dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.6);box-shadow:0 0 3px rgba(0,0,0,.4);transition:width .3s}
.dot.on{width:20px;background:#fff}
/* Settings: danh sách ảnh màn hình tổng */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.tb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb button{position:absolute;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:0}
.tb .x{top:4px;right:4px}
.tb .l{bottom:4px;left:4px}
.tb .r{bottom:4px;right:4px}
/* Settings */
.sect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sect h3{margin:0 0 8px;font-size:16px}
.sect .row{margin:8px 0 0}
.vrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.vrow .vl{width:92px;font-size:14px;font-weight:600;flex:none}
/* Chủ đề ở chế độ sửa */
.tophead{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tophead .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* Màn hình nhập hội thoại (kiểu chat) */
.cerow{background:var(--card);border:1px solid var(--tc);border-left:4px solid var(--tc);border-radius:12px;padding:8px 10px;margin:8px 0}
.cerow.T{margin-right:24px}
.cerow.R{margin-left:24px}
.cetop{display:flex;align-items:center;gap:2px}
.who-btn{border:0;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;background:var(--tc-bg);color:var(--tc-d)}
.who-btn::after{content:" ⇄";font-weight:400}
.icon.sm{min-width:34px;height:34px;font-size:17px;color:var(--muted)}
.cerow textarea{margin-top:6px;resize:none;overflow:hidden;line-height:1.35}
.addrow .btn{border-color:var(--tc);color:var(--tc-d)}
/* Trình phát (Listen từ vựng, Conversation) */
.pl .plopts{margin:0 0 8px}
.plist{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.lshead{position:sticky;top:0;z-index:1;background:var(--tc-bg);color:var(--tc-d);font-weight:700;font-size:14px;padding:6px 14px}
.lshead small{font-weight:400;margin-left:6px}
.lsitem{padding:10px 14px;border-left:4px solid transparent;cursor:pointer}
.lsitem .en{font-size:20px;font-weight:700}
.lsitem .vi{color:var(--muted);font-size:14px}
.lsitem .ex{font-size:17px;margin-top:2px}
.lsitem.cur{background:var(--tc-bg);border-left-color:var(--tc)}
/* Mỗi câu thoại: ảnh đại diện + bong bóng. THAI bên trái, TRANG bên phải. Câu đang đọc: ảnh phóng to */
.lnrow{display:flex;align-items:flex-end;gap:8px;margin:12px 10px;cursor:pointer}
.lnrow.R{flex-direction:row-reverse}
.ln{width:fit-content;max-width:calc(100% - 62px);padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--tc)}
.lnrow.T .ln{border-bottom-left-radius:4px}
.lnrow.R .ln{border-bottom-right-radius:4px}
.ln .yt{font-size:12px;font-weight:700;color:var(--tc-d)}
.ln .txt{font-size:17px}
.ln .vi{font-size:13px;color:var(--muted)}
.hide-vi .ln .vi{display:none}
.lnrow.cur .ln{background:var(--tc-bg)}
/* Ảnh đại diện hình bong bóng chat (SVG), mặt người bên trong */
.av{flex:none;width:48px;height:48px;color:var(--tc);overflow:visible;transform-origin:bottom center;transition:transform .3s,filter .3s}
.av.big{width:68px;height:68px}
.lnrow.cur .av{transform:scale(1.3);filter:drop-shadow(0 0 4px var(--tc))}
.sprow{display:flex;align-items:center;gap:12px;margin:12px 0}
.sprow .spname{margin:0;font-weight:700;color:var(--tc-d)}
.sprow .row{margin:8px 0 0}
.ln.you{border-style:dashed}
.reading{color:var(--tc-d)}
.reading.kara{color:var(--text)}
.sung{color:var(--tc-d)}
.lsbar{flex:none;padding-top:8px}
.lspos{align-items:center;margin:0}
.lspos span{font-size:14px;color:var(--muted);min-width:64px}
.lspos input{padding:0;border:0;background:none;margin:0}
.ctl{justify-content:center;align-items:center;gap:28px;margin:6px 0 0}
.ctl .play{width:60px;height:60px;border-radius:50%;background:var(--pri);color:#fff}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,440px);margin:calc(env(safe-area-inset-top) + 16px) auto auto;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:19px}
#dlgBtns{flex-wrap:wrap;justify-content:flex-end;margin:16px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--chip);border-color:var(--pri);color:var(--pri)}
.prog{text-align:center;color:var(--muted);margin:14px 0 0}
.card{background:var(--card);border:2px solid var(--tc);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;cursor:pointer}
.big{font-size:32px;font-weight:700;word-break:break-word}
.back{margin-top:16px;padding:14px;border-radius:14px;background:var(--tc-bg);width:100%;font-size:20px}
.back .ex{font-size:16px;color:var(--muted);margin-top:8px}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.row3{gap:8px}
.row3 .btn{padding:11px 6px;font-size:15px;white-space:nowrap}
.done{text-align:center;padding:40px 10px}
.done .big{margin-bottom:10px}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">MYEL</h1>
  <div id="actions"></div>
</header>
<main id="app"></main>

<!-- Khuôn hình bong bóng chat cho ảnh đại diện: THAI đuôi bên trái, TRANG đuôi bên phải -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="avclipT"><path d="M14 2H34A12 12 0 0 1 46 14V26A12 12 0 0 1 34 38H20L9 46L11 37.5A12 12 0 0 1 2 26V14A12 12 0 0 1 14 2Z"/></clipPath>
  <clipPath id="avclipR"><path transform="translate(48 0) scale(-1 1)" d="M14 2H34A12 12 0 0 1 46 14V26A12 12 0 0 1 34 38H20L9 46L11 37.5A12 12 0 0 1 2 26V14A12 12 0 0 1 14 2Z"/></clipPath>
</defs></svg>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="bannerIn" accept="image/*" multiple hidden>
<input type="file" id="avatarIn" accept="image/*" hidden>
<input type="file" id="xlsIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'tuvung-data-v1';

// Tra V2 / V3 của động từ bất quy tắc. Cụm động từ (take off) tra theo động từ đầu, giữ phần sau (took off).
// Động từ có tiền tố (rewrite, undertake, outrun) tra theo phần sau tiền tố. Không có trong bảng (động từ có quy tắc) → null.
function irregularOf(word) {
  const [first, ...rest] = normText(word).toLowerCase().split(' ');
  if (!first) return null;
  let v = IRREG_MAP.get(first), pre = '';
  if (!v && first !== 'relay') {
    for (const p of ['under', 'over', 'with', 'fore', 'mis', 'out', 're', 'un', 'up']) {
      if (first.startsWith(p) && IRREG_MAP.has(first.slice(p.length))) { pre = p; v = IRREG_MAP.get(first.slice(p.length)); break; }
    }
  }
  if (!v) return null;
  const tail = rest.length ? ' ' + rest.join(' ') : '';
  const f = s => s.split('/').map(x => pre + x + tail).join(' / ');
  return { v2: f(v.v2), v3: f(v.v3) };
}

// Bài hội thoại: mỗi dòng "THAI: câu | nghĩa" hoặc "TRANG: câu | nghĩa" (phần "| nghĩa" có hay không đều được)
function parseConv(text) {
  const lines = [];
  const rows = text.split(/\r?\n/);
  for (let n = 0; n < rows.length; n++) {
    const row = rows[n].trim();
    if (!row) continue;
    const m = row.match(/^(THAI|TRANG)\s*[:：]\s*(.*)$/i);
    if (!m) return { error: `Line ${n + 1} must start with "THAI:" or "TRANG:"\n\n${row}` };
    const bar = m[2].indexOf('|');
    const en = (bar < 0 ? m[2] : m[2].slice(0, bar)).trim();
    const vi = bar < 0 ? '' : m[2].slice(bar + 1).trim();
    if (!en) return { error: `Line ${n + 1}: the sentence is empty` };
    lines.push({ s: m[1].toUpperCase() === 'THAI' ? 'T' : 'R', en, vi });
  }
  if (!lines.length) return { error: 'Enter at least one line' };
  return { lines };
}
// Dán văn bản: mỗi dòng 1 câu. Dòng có "<tên người nói>:" (hoặc THAI:/TRANG:/T:/R:) ở đầu thì theo tên đó,
// dòng không có tên thì tự xen kẽ với người nói ở câu trước (prev: 'T' / 'R' / null).
function parseLoose(text, prev) {
  const rows = [];
  const namesT = [spk('T'), 'THAI', 'T'].map(x => x.toLowerCase());
  const names = [spk('T'), spk('R'), 'THAI', 'TRANG', 'T', 'R'].map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp('^(' + names.join('|') + ')\\s*[:：]\\s*(.*)$', 'i');
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const m = line.match(re);
    const s = m ? (namesT.includes(m[1].toLowerCase()) ? 'T' : 'R') : (prev === 'T' ? 'R' : 'T');
    const body = m ? m[2] : line;
    const bar = body.indexOf('|');
    const en = (bar < 0 ? body : body.slice(0, bar)).trim();
    if (!en) return;
    rows.push({ s, en, vi: bar < 0 ? '' : body.slice(bar + 1).trim() });
    prev = s;
  });
  return rows;
}

// Thu nhỏ ảnh, trả về JPEG (data URL)
// square = true: cắt phần vuông ở giữa, kích thước size x size
// square = false: giữ tỉ lệ, cạnh dài tối đa size
function resizeImage(file, size, square, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight, w, h;
      if (square) {
        const s = Math.min(sw, sh);
        sx = (sw - s) / 2;
        sy = (sh - s) / 2;
        sw = sh = s;
        w = h = size;
      } else {
        const k = Math.min(1, size / Math.max(sw, sh));
        w = Math.round(sw * k);
        h = Math.round(sh * k);
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality || 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

// ===== Notes: từ / cụm từ được tô đỏ trong câu ví dụ và câu thoại =====
// db.notes = [{id, text, ipa, vi, note}]. Mỗi lần hiện 1 câu, app dò câu đó xem có chứa từ nào trong Notes
// (không phân biệt hoa thường, theo nguyên từ) rồi tô đỏ. Thêm / xóa Notes thì mọi câu tự cập nhật.
function normText(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
function noteByText(s) { const k = normText(s).toLowerCase(); return db.notes.find(n => n.text.toLowerCase() === k); }

// Mẫu tìm kiếm (regex) của tất cả từ trong Notes: chuẩn bị 1 lần, dùng lại cho mọi câu.
// Notes thay đổi (thêm / sửa / xóa / Import) thì gọi notesChanged() để lần sau chuẩn bị lại.
let hlCache = null;
function notesChanged() { hlCache = null; }
// Các dạng thêm đuôi thông dụng của 1 từ (chữ thường): -s / -es / -ed / -ing,
// có xử lý nhân đôi phụ âm (set → setting), bỏ e (make → making), y → ies / ied (try → tries, tried).
// Từ dưới 3 chữ cái thì không đoán (tránh tô nhầm như us → uses). Động từ bất quy tắc ghi ở ô "Also match".
function wordForms(w) {
  const lw = w.toLowerCase(), out = new Set();
  if (lw.length < 3 || !/^[a-z]+$/.test(lw)) return out;
  if (/[^aeiou]y$/.test(lw)) {                       // try → tries, tried, trying
    const st = lw.slice(0, -1);
    out.add(st + 'ies'); out.add(st + 'ied'); out.add(lw + 'ing');
  } else if (/e$/.test(lw)) {                         // make → makes, maked(*), making ; free → freeing
    out.add(lw + 's'); out.add(lw + 'd');
    out.add(/(ee|ye|oe)$/.test(lw) ? lw + 'ing' : lw.slice(0, -1) + 'ing');
  } else {
    out.add(/(s|x|z|ch|sh|o)$/.test(lw) ? lw + 'es' : lw + 's'); // watch → watches, check → checks
    out.add(lw + 'ed'); out.add(lw + 'ing');
    if (/[^aeiou][aeiou][b-df-hj-np-tvz]$/.test(lw)) { // set → setting, stop → stopped
      const d = lw + lw.slice(-1);
      out.add(d + 'ed'); out.add(d + 'ing');
    }
  }
  return out;
}

// Tất cả chữ app sẽ tô đỏ cho 1 mục Notes: chữ gốc + V2 / V3 (động từ) + ô "Also match"
// + (nếu bật) dạng thêm đuôi của từ đầu tiên
function noteVariants(n) {
  const v = new Set([normText(n.text).toLowerCase()]);
  [n.v2, n.v3].forEach(x => String(x || '').split('/').map(s => normText(s).toLowerCase()).filter(Boolean).forEach(s => v.add(s)));
  String(n.also || '').split(',').map(s => normText(s).toLowerCase()).filter(Boolean).forEach(s => v.add(s));
  if (n.forms !== false) {
    const [first, ...rest] = normText(n.text).split(' ');
    wordForms(first).forEach(f => v.add([f, ...rest].join(' ').toLowerCase()));
  }
  return v;
}

function hlPattern() {
  if (hlCache) return hlCache;
  const ids = new Map(); // chữ cần tô (chữ thường) → id của mục Notes
  db.notes.filter(n => n.text).forEach(n => noteVariants(n).forEach(s => { if (!ids.has(s)) ids.set(s, n.id); }));
  if (!ids.size) return (hlCache = { re: null, ids });
  const pat = [...ids.keys()].sort((a, b) => b.length - a.length) // cụm dài ưu tiên trước
    .map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+')).join('|');
  return (hlCache = { ids, re: new RegExp('(^|[^A-Za-z0-9])(' + pat + ')(?![A-Za-z0-9])', 'gi') });
}
// Mục Notes ứng với 1 chữ (chữ gốc, chữ trong Also match hoặc dạng thêm đuôi)
function noteForText(s) {
  const id = hlPattern().ids.get(normText(s).toLowerCase());
  return id ? db.notes.find(n => n.id === id) : null;
}

// Trả về HTML của câu, các từ trong Notes được bọc <span class="nt"> (chữ đỏ, chạm vào xem nghĩa)
function hlHtml(text) {
  text = String(text || '');
  const { re, ids } = hlPattern();
  if (!re) return esc(text);
  re.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    const start = m.index + m[1].length, end = start + m[2].length;
    const id = ids.get(normText(m[2]).toLowerCase()) || '';
    out += esc(text.slice(last, start)) + `<span class="nt" data-nt="${id}">${esc(m[2])}</span>`;
    last = end;
    re.lastIndex = end;
  }
  return out + esc(text.slice(last));
}
// Vẽ lại phần tô đỏ của các câu đang hiện trên màn hình (sau khi thêm / sửa / xóa Notes)
function refreshHl() {
  document.querySelectorAll('[data-hl]').forEach(el => { if (!el.classList.contains('reading')) el.innerHTML = hlHtml(el.dataset.hl); });
}

// Thêm (n = null, text = từ đã bôi đen) hoặc sửa 1 mục Notes
async function editNote(n, text) {
  const r = await ask({
    title: n ? 'Edit note' : 'Add to Notes',
    fields: [
      { name: 'text', label: 'Word / phrase', required: 1, en: 1, value: n ? n.text : text },
      { name: 'type', label: 'Type', select: TYPES, value: n && n.type },
      { name: 'v2', label: 'V2 (past simple)', en: 1, value: n && n.v2 },
      { name: 'v3', label: 'V3 (past participle)', en: 1, value: n && n.v3 },
      { name: 'also', label: 'Also match (other forms, comma separated)', en: 1, ph: 'setup, set-up', value: n && n.also },
      { name: 'forms', label: 'Match word forms', value: n && n.forms === false ? '0' : '1',
        select: [['1', 'On – also -s / -es / -ed / -ing'], ['0', 'Off – exact words only']] },
      { name: 'ipa', label: 'Pronunciation', en: 1, ph: '/set ʌp/', value: n && n.ipa },
      { name: 'vi', label: 'Meaning', required: 1, value: n && n.vi },
      { name: 'note', label: 'Note', multi: 1, value: n && n.note }
    ],
    onChange: verbFormsHelper,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  r.v.text = normText(r.v.text);
  r.v.also = r.v.also.split(',').map(normText).filter(Boolean).join(', ');
  r.v.forms = r.v.forms !== '0';
  if (!isVerbType(r.v.type)) { r.v.v2 = ''; r.v.v3 = ''; }
  const dup = noteByText(r.v.text);
  if (dup && dup !== n) { toast(`"${r.v.text}" is already in Notes`); return; }
  if (n) Object.assign(n, r.v);
  else db.notes.push(Object.assign({ id: uid() }, r.v));
  save();
  notesChanged();
  refreshHl();
  if (location.hash === '#n') renderNotes();
  toast(n ? 'Note saved' : 'Added to Notes');
}

// Chạm vào chữ đỏ: xem nghĩa, nghe, sửa, xóa
async function showNote(id) {
  const n = db.notes.find(x => x.id === id);
  if (!n) return;
  const r = await ask({
    title: n.text,
    msg: [n.type ? TYPE_TAG[n.type] : '', n.ipa, n.vi, n.v2 || n.v3 ? `V2: ${n.v2 || '–'} · V3: ${n.v3 || '–'}` : '',
      n.note ? 'Note: ' + n.note : ''].filter(Boolean).join('\n'),
    buttons: [{ label: '🔊 Listen', value: null, keep: 1, run: () => speak(n.text) },
      { label: 'Remove', value: 'rm', cls: 'danger' }, { label: 'Edit', value: 'edit' }, { label: 'Close', value: null, cls: 'primary' }]
  });
  if (r.btn === 'edit') editNote(n);
  else if (r.btn === 'rm') removeNote(n);
}

function removeNote(n) {
  if (!confirm(`Remove "${n.text}" from Notes?`)) return;
  db.notes = db.notes.filter(x => x !== n);
  save();
  notesChanged();
  refreshHl();
  if (location.hash === '#n') renderNotes();
  toast('Removed from Notes');
}

// Bôi đen chữ trong câu ví dụ / câu thoại → hiện nút "＋ Add to Notes" ngay dưới chữ đã chọn
// (iPhone không cho thêm nút vào menu Copy / Look Up của iOS, nên app hiện nút riêng)
const ntAdd = document.createElement('button');
ntAdd.id = 'ntAdd';
ntAdd.className = 'btn small primary';
ntAdd.textContent = '＋ Add to Notes';
ntAdd.hidden = true;
document.body.appendChild(ntAdd);
ntAdd.onclick = () => {
  const text = ntAdd.dataset.text;
  ntAdd.hidden = true;
  const sel = window.getSelection();
  if (sel) sel.removeAllRanges();
  const n = noteForText(text); // chữ đã có trong Notes (kể cả dạng khác): mở hộp nghĩa thay vì thêm mới
  if (n) showNote(n.id); else editNote(null, text);
};
let selTimer = null;
document.addEventListener('selectionchange', () => { clearTimeout(selTimer); selTimer = setTimeout(checkSelection, 250); });
function checkSelection() {
  const sel = window.getSelection();
  const text = sel && sel.rangeCount ? normText(sel.toString()).replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '') : '';
  const node = sel && sel.anchorNode ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement) : null;
  if (!text || text.length > 60 || !node || !node.closest('[data-hl]') || $('#dlg').open) { ntAdd.hidden = true; return; }
  const rc = sel.getRangeAt(0).getBoundingClientRect();
  ntAdd.dataset.text = text;
  ntAdd.hidden = false;
  const top = rc.bottom + 10 + ntAdd.offsetHeight > innerHeight ? rc.top - ntAdd.offsetHeight - 10 : rc.bottom + 10;
  ntAdd.style.top = Math.max(8, top) + 'px';
  ntAdd.style.left = Math.min(Math.max(8, rc.left + rc.width / 2 - ntAdd.offsetWidth / 2), innerWidth - ntAdd.offsetWidth - 8) + 'px';
}

// Màn hình danh sách động từ bất quy tắc (mở từ màn hình tổng): bảng kẻ ô, chạm vào từng dạng để nghe.
// Tìm kiếm không lọc danh sách: cuộn tới dòng khớp và tô màu dòng đó; ▲ ▼ (hoặc Return) để chuyển giữa các dòng khớp.
function renderIrregular() {
  setBar('Irregular verbs', '', []);
  app.className = 'fill';
  const say = s => s.replace(/\//g, ' or ');
  app.innerHTML = `
    <div class="irbar">
      <input type="search" id="irq" class="grow" placeholder="Search: take, took, lấy…" autocomplete="off" autocapitalize="none" spellcheck="false" lang="en" enterkeyhint="next">
      <span class="cnt" id="irc"></span>
      <button class="icon sm" id="irUp" aria-label="Previous match">▲</button>
      <button class="icon sm" id="irDn" aria-label="Next match">▼</button>
    </div>
    <p class="muted">${IRREG.length} verbs · tap a word to hear it · 🔊 all three forms</p>
    <div class="irtable" id="irl">
      <div class="irhead"><span>V1</span><span>V2 (past)</span><span>V3 (p.p.)</span><span></span></div>
      ${IRREG.map((v, i) => `<div class="irrow" data-i="${i}">
        <span class="tc0" data-say="${esc(say(v.b))}">${esc(v.b)}</span>
        <span class="tc1" data-say="${esc(say(v.v2))}">${esc(v.v2)}</span>
        <span class="tc2" data-say="${esc(say(v.v3))}">${esc(v.v3)}</span>
        <button class="icon" data-say="${esc(say(v.b + ', ' + v.v2 + ', ' + v.v3))}" aria-label="Listen to all forms">🔊</button>
        <div class="irvi">${esc(v.vi)}</div>
      </div>`).join('')}
    </div>`;
  const rows = [...document.querySelectorAll('#irl .irrow')];
  let hits = [], cur = -1;
  const go = k => { // chuyển tới dòng khớp thứ k
    if (!hits.length) return;
    cur = (k + hits.length) % hits.length;
    rows.forEach(r => r.classList.remove('cur'));
    const r = rows[hits[cur]];
    r.classList.add('cur');
    const box = $('#irl'); // đưa dòng vào giữa bảng (tính theo vị trí trên màn hình)
    box.scrollTop += r.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 2 + r.offsetHeight / 2;
    $('#irc').textContent = `${cur + 1} / ${hits.length}`;
  };
  const find = q => {
    q = q.trim().toLowerCase();
    rows.forEach(r => r.classList.remove('hit', 'cur'));
    hits = [];
    cur = -1;
    if (!q) { $('#irc').textContent = ''; return; }
    IRREG.forEach((v, i) => { if ([v.b, v.v2, v.v3, v.vi].some(s => s.toLowerCase().includes(q))) hits.push(i); });
    hits.forEach(i => rows[i].classList.add('hit'));
    if (!hits.length) { $('#irc').textContent = '0'; return; }
    // Ưu tiên dòng có 1 dạng trùng khớp hoàn toàn (gõ "took" → dòng take, không phải mistake)
    const exact = hits.findIndex(i => [IRREG[i].b, ...IRREG[i].v2.split('/'), ...IRREG[i].v3.split('/')].includes(q));
    go(exact >= 0 ? exact : 0);
  };
  $('#irq').oninput = e => find(e.target.value);
  $('#irq').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(cur + 1); } };
  $('#irUp').onclick = () => go(cur - 1);
  $('#irDn').onclick = () => go(cur + 1);
  $('#irl').onclick = e => { const s = e.target.closest('[data-say]'); if (s) speak(s.dataset.say); };
}

// Màn hình danh sách Notes (mở từ nút 📝 ở màn hình Vocabulary)
function renderNotes() {
  setBar('Notes', 'v', [['＋', 'Add note', () => editNote(null, '')]]);
  const ns = db.notes.slice().sort((a, b) => a.text.localeCompare(b.text));
  app.className = 'notes';
  app.innerHTML = `
    <p class="muted">Words and phrases shown in red in example sentences and conversations. Tap one to edit.</p>
    <ul class="list" id="notes">${ns.length ? ns.map(n => `
      <li class="item">
        <button class="icon" data-say="${esc(n.text)}" aria-label="Pronounce">🔊</button>
        <div class="grow" data-n="${n.id}" style="cursor:pointer">
          <b class="ntc">${esc(n.text)}</b> ${typeTagHtml(n)} ${n.ipa ? `<span class="ipa">${esc(n.ipa)}</span>` : ''}
          <div>${esc(n.vi)}</div>
          ${verbFormsHtml(n)}
          ${n.also ? `<small>Also: ${esc(n.also)}</small>` : ''}
          ${n.forms === false ? '<small>Word forms: off</small>' : ''}
          ${n.note ? `<small>${esc(n.note)}</small>` : ''}
        </div>
        <button class="icon sm" data-rm="${n.id}" aria-label="Remove">✕</button>
      </li>`).join('')
      : '<li class="empty">No notes yet.<br>Select a word or phrase in an example sentence, then tap “＋ Add to Notes”.</li>'}</ul>`;
  $('#notes').onclick = e => {
    const say = e.target.closest('[data-say]');
    const rm = e.target.closest('[data-rm]');
    const it = e.target.closest('[data-n]');
    if (say) speak(say.dataset.say);
    else if (rm) removeNote(db.notes.find(x => x.id === rm.dataset.rm));
    else if (it) editNote(db.notes.find(x => x.id === it.dataset.n));
  };
}

// ===== Đổi vị trí trong danh sách (nút ↑ / ↓) =====
function mvBtns(i, n) {
  return `<button class="icon sm" data-mv="-1" data-i="${i}" aria-label="Move up" ${i ? '' : 'disabled'}>↑</button>` +
    `<button class="icon sm" data-mv="1" data-i="${i}" aria-label="Move down" ${i < n - 1 ? '' : 'disabled'}>↓</button>`;
}
// Đổi chỗ phần tử thứ i với phần tử kề trên (d = -1) / dưới (d = 1), rồi lưu. Trả về true nếu đã đổi.
function moveIn(list, i, d) {
  const j = i + d;
  if (j < 0 || j >= list.length) return false;
  [list[i], list[j]] = [list[j], list[i]];
  save();
  return true;
}
// Vẽ lại màn hình nhưng giữ vị trí cuộn của danh sách
function keepScroll(sel, redraw) {
  const el = $(sel);
  const y = el ? el.scrollTop : 0;
  redraw();
  const el2 = $(sel);
  if (el2) el2.scrollTop = y;
}

// ===== Tiện ích giao diện =====
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// actions: [[nội dung nút, nhãn, hàm, class thêm], ...]
function setBar(title, backHash, actions) {
  $('#title').textContent = title;
  const b = $('#back');
  b.hidden = backHash == null;
  b.onclick = () => { location.hash = backHash; };
  const box = $('#actions');
  box.innerHTML = '';
  (actions || []).forEach(([text, label, fn, cls]) => {
    const btn = document.createElement('button');
    btn.className = 'icon ' + (cls || '');
    btn.textContent = text;
    btn.setAttribute('aria-label', label);
    btn.onclick = fn;
    box.appendChild(btn);
  });
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');
}

// Hộp thoại chung: trả về Promise {btn, v}
// fields: {name, label, required, en, multi, rows, ph, value, image}  (image: ô chọn ảnh chủ đề)
// buttons: {label, value, cls, check, run, keep}  (run: chạy ngay khi bấm, ví dụ mở hộp chọn ảnh; keep: không đóng hộp thoại)
// field có select: [[giá trị, nhãn], ...] thì hiện ô chọn
// onChange(f, tên ô vừa đổi): gọi khi giá trị 1 ô thay đổi (và 1 lần lúc mở, tên = null).
//   f.get(tên), f.set(tên, giá trị), f.show(tên, true/false) để đọc / ghi / ẩn hiện ô.
function ask({ title, msg, fields = [], buttons, onChange }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    const imgs = {}; // giá trị ảnh hiện tại của các ô chọn ảnh
    const finish = r => { d.oncancel = null; d.close(); resolve(r); };
    d.oncancel = e => { e.preventDefault(); finish({ btn: null, v: {} }); };
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = (msg ? `<p>${esc(msg)}</p>` : '') + fields.map(f => {
      if (f.image) {
        imgs[f.name] = f.value || '';
        return `<div class="label">${esc(f.label)}</div>
          <div class="imgpick" data-img="${f.name}">
            <span data-prev>${thumbHtml(imgs[f.name], 'big')}</span>
            <div class="btns">
              <button type="button" class="btn small" data-pick>Choose image</button>
              <button type="button" class="btn small danger" data-rm ${imgs[f.name] ? '' : 'hidden'}>Remove image</button>
            </div>
            <input type="file" accept="image/*" hidden>
          </div>`;
      }
      const attr = `name="${f.name}" placeholder="${esc(f.ph || '')}" autocomplete="off"` +
        (f.en ? ' autocapitalize="none" spellcheck="false" lang="en"' : '');
      const input = f.select // f.select: [[giá trị, nhãn], ...]
        ? `<select name="${f.name}" style="display:block;width:100%;margin-top:4px">${f.select.map(([v, l]) =>
            `<option value="${esc(v)}" ${v === (f.value || '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
        : f.multi
        ? `<textarea ${attr} rows="${f.rows || 2}">${esc(f.value)}</textarea>`
        : `<input ${attr} value="${esc(f.value)}">`;
      return `<label>${esc(f.label)}${f.required ? ' *' : ''}${input}</label>`;
    }).join('');
    d.querySelectorAll('[data-img]').forEach(box => {
      const name = box.dataset.img;
      const file = box.querySelector('input[type=file]');
      const rm = box.querySelector('[data-rm]');
      const show = () => {
        box.querySelector('[data-prev]').innerHTML = thumbHtml(imgs[name], 'big');
        rm.hidden = !imgs[name];
      };
      box.querySelector('[data-pick]').onclick = () => file.click();
      rm.onclick = () => { imgs[name] = ''; show(); };
      file.onchange = async () => {
        const f = file.files[0];
        file.value = '';
        if (!f) return;
        try { imgs[name] = await resizeImage(f, IMG_SIZE, true); show(); }
        catch (e) { toast('Could not read this image'); }
      };
    });
    const box = $('#dlgBtns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => {
        const v = {};
        let bad = null;
        fields.forEach(f => {
          if (f.image) { v[f.name] = imgs[f.name]; return; }
          const el = d.querySelector(`[name="${f.name}"]`);
          v[f.name] = el.value.trim();
          el.classList.toggle('bad', !!(b.check && f.required && !v[f.name]));
          if (b.check && f.required && !v[f.name] && !bad) bad = el;
        });
        if (bad) { bad.focus(); toast('Please fill in the fields marked *'); return; }
        if (b.run) b.run();
        if (b.keep) return; // nút không đóng hộp thoại (ví dụ nghe phát âm)
        finish({ btn: b.value, v });
      };
      box.appendChild(btn);
    });
    const fld = n => d.querySelector(`[name="${n}"]`);
    const api = {
      get: n => (fld(n) ? fld(n).value : ''),
      set: (n, v) => { if (fld(n)) fld(n).value = v; },
      show: (n, on) => { if (fld(n)) fld(n).closest('label').hidden = !on; }
    };
    $('#dlgBody').onchange = onChange ? e => onChange(api, e.target.name) : null;
    if (onChange) onChange(api, null);
    d.showModal();
    const first = d.querySelector('input:not([type=file]),textarea');
    if (first) first.focus();
  });
}

// ===== Giọng đọc (giọng có sẵn trên máy, chạy offline) =====
// kind: 'V' từ vựng, 'T' THAI (nam), 'R' TRANG (nữ)
const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
const MALE = /(Evan|Nathan|Aaron|Tom\b|Alex\b|Fred|Daniel|Rishi|Gordon|Arthur|Oliver|Reed|Rocko|Eddy|Grandpa|Ralph|Junior|David|Mark|Guy|Andrew|Brian|Christopher|Eric|Roger|Davis|Tony|Jason)/i;
const FEMALE = /(Samantha|Ava|Zoe|Allison|Susan|Victoria|Nicky|Joelle|Noelle|Karen|Moira|Tessa|Kate|Serena|Martha|Catherine|Kathy|Flo\b|Sandy|Shelley|Grandma|Zira|Aria|Jenny|Michelle|Emma|Sara|Nancy|Amber|Ashley|Cora|Elizabeth|Monica|Google US English)/i;
function enVoices() {
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
}
function voiceScore(v) {
  return (/^en[-_]US/i.test(v.lang) ? 10 : 0) + (/premium/i.test(v.name) ? 3 : /enhanced/i.test(v.name) ? 2 : 0) + (/samantha/i.test(v.name) ? 1 : 0);
}
function bestVoice(re) {
  const vs = enVoices().filter(v => !re || re.test(v.name));
  vs.sort((a, b) => voiceScore(b) - voiceScore(a));
  return vs[0] || null;
}
// Trả về {v: giọng, pitch: cao độ}. Không có giọng nam thì THAI dùng giọng khác và chỉnh trầm xuống.
function voiceFor(kind) {
  const pref = { V: opt.voiceV, T: opt.voiceT, R: opt.voiceR }[kind];
  const chosen = pref && enVoices().find(v => v.name === pref);
  if (kind === 'V') return { v: chosen || bestVoice(null), pitch: 1 };
  if (kind === 'R') return { v: chosen || bestVoice(FEMALE) || bestVoice(null), pitch: 1 };
  const v = chosen || bestVoice(MALE);
  if (v && v !== voiceFor('R').v) return { v, pitch: 1 };
  return { v: v || bestVoice(null), pitch: 0.7 };
}
function makeUtter(text, kind, rate) {
  const u = new SpeechSynthesisUtterance(text);
  const { v, pitch } = voiceFor(kind);
  u.lang = v ? v.lang : 'en-US';
  if (v) u.voice = v;
  u.pitch = pitch;
  u.rate = rate;
  return u;
}
function speak(text, kind) {
  if (!('speechSynthesis' in window)) { toast('Speech is not supported on this device'); return; }
  speechSynthesis.cancel();
  speechSynthesis.speak(makeUtter(text, kind || 'V', 0.9));
}
function allVoiceCount() { return 'speechSynthesis' in window ? speechSynthesis.getVoices().length : 0; }
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { if (location.hash === '#set') renderSettings(); };
}
// iPhone thường trả về danh sách giọng trống ở lần hỏi đầu và có thể không báo khi danh sách sẵn sàng:
// hỏi lại vài lần (khoảng 6 giây), có danh sách thì vẽ lại màn hình Settings.
let voicePoll = null;
function pollVoices() {
  clearInterval(voicePoll);
  let n = 0;
  voicePoll = setInterval(() => {
    n++;
    if (enVoices().length || n > 20 || location.hash !== '#set') {
      clearInterval(voicePoll);
      if (enVoices().length && location.hash === '#set') renderSettings();
    }
  }, 300);
}

// Tiếng "ting" nhẹ khi chuyển chủ đề / bài (tạo bằng Web Audio, không cần file âm thanh)
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function ding() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1320, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + 0.65);
}

// Giữ màn hình không tắt trong lúc phát (máy không hỗ trợ thì bỏ qua)
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}

// ===== Trình chiếu ảnh màn hình tổng (lật trang như sách) =====
// Các ảnh xếp chồng lên nhau. Sang ảnh sau: trang hiện tại xoay quanh gáy bên trái để lộ ảnh bên dưới.
// Về ảnh trước: trang trước lật ngược từ bên trái trở lại đè lên trang hiện tại.
let slideTimer = null;
function slidesHtml(imgs) {
  return `<div class="banner framed" id="slides">
    ${imgs.map(src => `<div class="pg"><img src="${esc(src)}" alt=""></div>`).join('')}
    ${imgs.length > 1 ? `<div class="dots">${imgs.map((_, i) => `<button class="dot" data-d="${i}" aria-label="Image ${i + 1}"></button>`).join('')}</div>` : ''}
  </div>`;
}

function startSlides(n) {
  const pages = [...document.querySelectorAll('#slides .pg')];
  let cur = 0;
  let busy = false;
  const zoom = p => { // phóng to chậm ảnh đang hiện
    const img = p.querySelector('img');
    img.classList.remove('zoom');
    void img.offsetWidth;
    img.classList.add('zoom');
  };
  const setDots = k => document.querySelectorAll('#slides .dot').forEach((d, i) => d.classList.toggle('on', i === k));
  const layout = () => pages.forEach((p, i) => {
    p.classList.remove('turn');
    p.style.transform = '';
    p.style.zIndex = i === cur ? 3 : 1;
    p.style.visibility = i === cur ? 'visible' : 'hidden';
  });
  const flipTo = (to, back) => {
    if (busy || to === cur) return;
    busy = true;
    const a = pages[cur], b = pages[to];
    b.style.visibility = 'visible';
    if (!back) {
      b.style.zIndex = 2;
      a.classList.add('turn');
      a.style.transform = 'rotateY(-180deg)';
    } else {
      b.style.zIndex = 4;
      b.style.transform = 'rotateY(-180deg)';
      void b.offsetWidth;
      b.classList.add('turn');
      b.style.transform = 'rotateY(0deg)';
    }
    zoom(b);
    setDots(to);
    setTimeout(() => { cur = to; layout(); busy = false; }, 950);
  };
  const next = () => flipTo((cur + 1) % n, false);
  const prev = () => flipTo((cur - 1 + n) % n, true);
  const restart = () => { clearInterval(slideTimer); if (n > 1) slideTimer = setInterval(next, SLIDE_MS); };
  layout();
  setDots(0);
  zoom(pages[0]);
  restart();
  if (n < 2) return;
  const box = $('#slides');
  let x0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (dx < -40) { next(); restart(); }
    else if (dx > 40) { prev(); restart(); }
  });
  box.querySelectorAll('[data-d]').forEach(d => d.onclick = () => { const k = +d.dataset.d; flipTo(k, k < cur); restart(); });
}

  save();
  editing = t.id; // chủ đề mới: mở ở chế độ sửa để thêm từ ngay
  location.hash = 't/' + t.id;
}

// ===== Từ vựng: màn hình chủ đề / chủ đề con =====
// Chủ đề: danh sách chủ đề con + các từ nằm thẳng trong chủ đề. Study / Listen gồm cả từ của chủ đề con.
// Chủ đề con (sub): các từ của chủ đề con đó.
// Chế độ xem: chỉ học (nghe, đánh dấu đã thuộc). Bấm ⚙ để vào chế độ sửa.
function renderTopic(t, sub) {
  st = null;
  const box = sub || t;                          // nơi chứa các từ đang hiển thị
  const path = sub ? t.id + '/' + sub.id : t.id; // dùng cho đường dẫn Study / Listen
  const ed = editing === box.id;
  const subs = sub ? [] : (t.subs || []);
  const studyWords = sub ? sub.words : allWords(t);
  setBar(box.name, sub ? 't/' + t.id : 'v', [ed
    ? ['Done', 'Finish editing', () => { editing = null; renderTopic(t, sub); }, 'text']
    : ['⚙', sub ? 'Edit subtopic' : 'Edit topic', () => { editing = box.id; renderTopic(t, sub); }]]);
  app.className = tcClass(t);
  app.innerHTML = `
    ${ed ? (sub ? subHeadHtml(sub) : topHeadHtml(t)) : ''}
    <div class="row">
      <button class="btn primary grow" id="study" ${studyWords.length ? '' : 'disabled'}>▶ Study</button>
      ${ed ? '<button class="btn grow" id="addW">＋ Add word</button>'
           : `<button class="btn grow" id="listen" ${studyWords.length ? '' : 'disabled'}>🎧 Listen</button>`}
    </div>
    ${ed && !sub ? '<div class="row"><button class="btn grow" id="addS">＋ Add subtopic</button></div>' : ''}
    ${studyWords.some(w => w.exvi) ? `<div class="opts">${exviChipHtml()}</div>` : ''}
    ${subs.length ? `<ul class="list" id="subs">${subs.map((s, i) => {
      const n = s.words.filter(w => w.learned).length;
      const pct = s.words.length ? Math.round(n * 100 / s.words.length) : 0;
      const inner = `<div class="grow"><b>${esc(s.name)}</b><small>${s.words.length} words · ${n} learned</small>
          <div class="bar"><i style="width:${pct}%"></i></div></div>`;
      // Chế độ sửa: thêm nút ↑ / ↓ để đổi thứ tự chủ đề con (chạm vào tên vẫn mở chủ đề con)
      return ed
        ? `<li class="item"><a class="grow" href="#t/${t.id}/${s.id}" style="color:inherit;text-decoration:none">${inner}</a>${mvBtns(i, subs.length)}</li>`
        : `<li><a class="item" href="#t/${t.id}/${s.id}">${inner}<span class="chev">›</span></a></li>`;
    }).join('')}</ul>` : ''}
    ${box.words.length || !subs.length ? `
      ${subs.length ? '<p class="muted">Words in this topic</p>' : ''}
      ${ed && box.words.length ? '<p class="muted">Tap a word to edit or delete it.</p>' : ''}
      ${box.words.length > 5 ? '<input type="search" id="q" placeholder="Search…">' : ''}
      <ul class="list" id="words"></ul>` : ''}`;
  $('#study').onclick = () => { location.hash = 's/' + path; };
  bindExviChip();
  if (ed) {
    $('#addW').onclick = () => editWord(t, box, null);
    if (sub) {
      $('#editS').onclick = () => renameSub(sub);
      $('#delS').onclick = () => deleteSub(t, sub);
    } else {
      $('#addS').onclick = () => addSub(t);
      $('#editT').onclick = () => editTopic(t);
      $('#delT').onclick = () => deleteTopic(t, db.topics, 'words', 'v');
      const sl = $('#subs');
      if (sl) sl.onclick = e => {
        const b = e.target.closest('[data-mv]');
        if (b && moveIn(t.subs, +b.dataset.i, +b.dataset.mv)) renderTopic(t, sub);
      };
    }
  } else {
    $('#listen').onclick = () => { location.hash = 'l/' + path; };
  }
  const words = $('#words');
  if (!words) return;
  const q = $('#q');
  if (q) q.oninput = () => drawWords(box, q.value);
  words.onclick = e => {
    const nt = editing === box.id ? null : e.target.closest('.nt'); // chạm chữ đỏ: xem nghĩa trong Notes
    if (nt) { showNote(nt.dataset.nt); return; }
    const say = e.target.closest('[data-say]');
    const learn = e.target.closest('[data-learn]');
    const edit = e.target.closest('[data-edit]');
    if (say) speak(say.dataset.say);
    else if (learn) {
      const w = box.words.find(x => x.id === learn.dataset.learn);
      w.learned = !w.learned;
      save();
      drawWords(box, q ? q.value : ''); // sắp xếp lại: từ chưa thuộc lên trên
    } else if (edit && editing === box.id) editWord(t, box, box.words.find(x => x.id === edit.dataset.edit));
  };
  drawWords(box, '');
}

function topHeadHtml(t) {
  return `<div class="tophead">${thumbHtml(t.img, 'big')}
    <div class="grow"><b>${esc(t.name)}</b>
      <div class="btns">
        <button class="btn small" id="editT">Edit topic</button>
        <button class="btn small danger" id="delT">Delete topic</button>
      </div>
    </div></div>`;
}

function subHeadHtml(sub) {
  return `<div class="tophead">
    <div class="grow"><b>${esc(sub.name)}</b>
      <div class="btns">
        <button class="btn small" id="editS">Rename subtopic</button>
        <button class="btn small danger" id="delS">Delete subtopic</button>
      </div>
    </div></div>`;
}

async function addSub(t) {
  const r = await ask({
    title: 'Add subtopic',
    fields: [{ name: 'name', label: 'Subtopic name', required: 1, ph: 'e.g. 1. iPhone Setup' }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  if (!t.subs) t.subs = [];
  const s = { id: uid(), name: r.v.name, words: [] };
  t.subs.push(s);
  save();
  editing = s.id; // chủ đề con mới: mở ở chế độ sửa để thêm từ ngay
  location.hash = 't/' + t.id + '/' + s.id;
}

async function renameSub(sub) {
  const r = await ask({
    title: 'Rename subtopic',
    fields: [{ name: 'name', label: 'Subtopic name', required: 1, value: sub.name }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  sub.name = r.v.name;
  save();
  render();
}

function deleteSub(t, sub) {
  if (!confirm(`Delete subtopic "${sub.name}" and its ${sub.words.length} words?`)) return;
  t.subs = t.subs.filter(x => x !== sub);
  save();
  location.hash = 't/' + t.id;
}

// Nút ẩn / hiện dịch câu ví dụ (Example meaning), dùng chung cho danh sách từ, Study, Listen
function exviChipHtml() {
  return `<button class="chip ${opt.exvi ? 'on' : ''}" id="exviChip">Example meaning</button>`;
}
function bindExviChip() {
  const b = $('#exviChip');
  if (b) b.onclick = () => {
    opt.exvi = !opt.exvi;
    saveOpt();
    document.body.classList.toggle('hide-exvi', !opt.exvi);
    b.classList.toggle('on', opt.exvi);
  };
}

// Từ chưa thuộc ở trên, từ đã thuộc ở dưới (mỗi nhóm giữ thứ tự đăng ký: từ thêm sau ở trên)
function drawWords(t, q) {
  const ed = editing === t.id;
  q = q.trim().toLowerCase();
  const ws = t.words.filter(w => !q || (w.en + ' ' + w.vi).toLowerCase().includes(q));
  const todo = ws.filter(w => !w.learned);
  const done = ws.filter(w => w.learned);
  const row = w => `
    <li class="item">
      <button class="icon" data-say="${esc(w.en)}" aria-label="Pronounce">🔊</button>
      <div class="grow" ${ed ? `data-edit="${w.id}" style="cursor:pointer"` : ''}>
        <b ${ed ? '' : `data-say="${esc(w.en)}"`}>${esc(w.en)}</b> ${typeTagHtml(w)} ${w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}
        <div>${esc(w.vi)}</div>
        ${verbFormsHtml(w)}
        ${w.ex ? `<small class="ex">${ed ? '' : `<button class="spk" data-say="${esc(w.ex)}" aria-label="Listen to the example">🔈</button>`}<span data-hl="${esc(w.ex)}">${hlHtml(w.ex)}</span></small>` : ''}
        ${w.exvi ? `<small class="exvi">${esc(w.exvi)}</small>` : ''}
      </div>
      ${ed ? `<span class="pen" data-edit="${w.id}">✎</span>` : ''}
      <button class="icon chk ${w.learned ? 'on' : ''}" data-learn="${w.id}" aria-label="Learned">✓</button>
    </li>`;
  $('#words').innerHTML = ws.length
    ? todo.map(row).join('') + (done.length ? `<li class="divider">✓ Learned (${done.length})</li>` + done.map(row).join('') : '')
    : `<li class="empty">${t.words.length ? 'Not found.' : (ed ? 'No words yet. Tap “＋ Add word”.' : 'No words yet. Tap ⚙ to add words.')}</li>`;
}

// Dùng chung cho chủ đề từ vựng và chủ đề hội thoại
async function editTopic(t) {
  const r = await ask({
    title: 'Edit topic',
    fields: topicFields(t),
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  t.name = r.v.name;
  t.img = r.v.img;
  save();
  render();
}

// list: db.topics hoặc db.conv, child: tên mảng con ('words' / 'items'), backHash: màn hình quay về
function deleteTopic(t, list, child, backHash) {
  const n = child === 'words' ? allWords(t).length : t[child].length;
  if (!confirm(`Delete topic "${t.name}" and its ${n} ${child === 'words' ? 'words' : 'conversations'}?`)) return;
  list.splice(list.indexOf(t), 1);
  save();
  location.hash = backHash;
}

// Hộp thêm / sửa từ và Notes: chỉ hiện ô V2 / V3 khi Type là động từ.
// Chọn động từ (hoặc sửa từ) mà V2, V3 đang trống → tự điền nếu là động từ bất quy tắc (động từ có quy tắc thì để trống).
// Ô chứa từ: 'en' (từ vựng) hoặc 'text' (Notes).
function verbFormsHelper(f, changed) {
  const verb = isVerbType(f.get('type'));
  f.show('v2', verb);
  f.show('v3', verb);
  const word = f.get('en') || f.get('text');
  if (verb && (changed === 'type' || changed === 'en' || changed === 'text') && !f.get('v2') && !f.get('v3')) {
    const ir = irregularOf(word);
    if (ir) { f.set('v2', ir.v2); f.set('v3', ir.v3); }
  }
}

// Nhãn loại từ và dòng V2 / V3 (dùng ở danh sách từ, Study, Notes)
function typeTagHtml(x) { return x.type && TYPE_TAG[x.type] ? `<span class="pos">${TYPE_TAG[x.type]}</span>` : ''; }
function verbFormsHtml(x, tag) {
  if (!x.v2 && !x.v3) return '';
  return `<${tag || 'small'} class="vf">V2: ${esc(x.v2 || '–')} · V3: ${esc(x.v3 || '–')}</${tag || 'small'}>`;
}

// t: chủ đề, box: nơi đang chứa từ (chủ đề hoặc chủ đề con), w: từ cần sửa (null = thêm mới)
// Chủ đề có chủ đề con thì có ô "Subtopic" để chọn nơi chứa từ; chọn nơi khác thì từ được chuyển sang đó.
async function editWord(t, box, w) {
  const isNew = !w;
  const subs = t.subs || [];
  const fields = [
    { name: 'en', label: 'English word', required: 1, en: 1, value: w && w.en },
    { name: 'type', label: 'Type', select: TYPES, value: w && w.type },
    { name: 'v2', label: 'V2 (past simple)', en: 1, value: w && w.v2 },
    { name: 'v3', label: 'V3 (past participle)', en: 1, value: w && w.v3 },
    { name: 'ipa', label: 'Pronunciation', en: 1, ph: '/ˈæp.əl/', value: w && w.ipa },
    { name: 'vi', label: 'Meaning', required: 1, value: w && w.vi },
    { name: 'ex', label: 'Example', multi: 1, en: 1, value: w && w.ex },
    { name: 'exvi', label: 'Example meaning', multi: 1, value: w && w.exvi }
  ];
  if (subs.length) fields.push({ name: 'sub', label: 'Subtopic', value: box === t ? '' : box.id,
    select: [['', '(none – directly in topic)']].concat(subs.map(s => [s.id, s.name])) });
  const r = await ask({
    title: isNew ? 'Add word' : 'Edit word',
    fields,
    onChange: verbFormsHelper,
    buttons: isNew
      ? [{ label: 'Cancel', value: null }, { label: 'Save & add next', value: 'next', check: 1 }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
      : [{ label: 'Delete', value: 'del', cls: 'danger' }, { label: 'Cancel', value: null }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
  });
  if (r.btn === 'del') {
    if (confirm(`Delete "${w.en}"?`)) {
      box.words = box.words.filter(x => x !== w);
      save();
      render();
    }
    return;
  }
  if (!r.btn) return;
  const target = (r.v.sub && subById(t, r.v.sub)) || t; // nơi chứa từ sau khi lưu
  delete r.v.sub;
  if (!isVerbType(r.v.type)) { r.v.v2 = ''; r.v.v3 = ''; } // V2 / V3 chỉ dùng cho động từ
  if (isNew) {
    const dup = target.words.some(x => x.en.toLowerCase() === r.v.en.toLowerCase());
    if (dup && !confirm(`"${r.v.en}" already exists in "${target.name}". Add anyway?`)) return;
    target.words.unshift(Object.assign({ id: uid(), learned: false }, r.v));
    toast(target === box ? 'Added: ' + r.v.en : `Added to "${target.name}": ${r.v.en}`);
  } else {
    Object.assign(w, r.v);
    if (target !== box) { // chuyển từ sang chủ đề / chủ đề con khác (giữ nguyên trạng thái đã thuộc)
      box.words = box.words.filter(x => x !== w);
      target.words.unshift(w);
      toast(`Moved to "${target.name}"`);
    }
  }
  save();
  render();
  if (r.btn === 'next') editWord(t, target, null);
}

// ===== Học flashcard =====
// words: các từ cần học; key: id của chủ đề / chủ đề con đang học
function buildDeck(words, key) {
  const ids = words.filter(w => !opt.onlyNew || !w.learned).map(w => w.id);
  if (opt.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  }
  st = { tid: key, ids, i: 0, flip: false };
}

// Chủ đề: học tất cả từ (kể cả chủ đề con). Chủ đề con: chỉ từ của chủ đề con đó.
function renderStudy(t, sub) {
  const box = sub || t;
  const words = sub ? sub.words : allWords(t);
  setBar('Study: ' + box.name, 't/' + t.id + (sub ? '/' + sub.id : ''), []);
  if (!st || st.tid !== box.id) buildDeck(words, box.id);
  st.ids = st.ids.filter(id => words.some(w => w.id === id)); // bỏ từ đã bị xóa
  const opts = `
    <div class="opts">
      <button class="chip" data-o="dir">${opt.dir === 'en' ? 'EN → Meaning' : 'Meaning → EN'}</button>
      <button class="chip ${opt.shuffle ? 'on' : ''}" data-o="shuffle">Shuffle</button>
      <button class="chip ${opt.onlyNew ? 'on' : ''}" data-o="onlyNew">Not learned only</button>
      ${words.some(w => w.ex) ? `<button class="chip ${opt.stEx ? 'on' : ''}" data-o="stEx">Example</button>` : ''}
      ${opt.stEx && words.some(w => w.exvi) ? exviChipHtml() : ''}
    </div>`;
  const n = st.ids.length;
  let body;
  if (!n) {
    body = `<div class="done"><div class="big">🎉</div><p>${opt.onlyNew ? 'You have learned all the words in this topic!' : 'This topic has no words yet.'}</p></div>`;
  } else if (st.i >= n) {
    body = `<div class="done"><div class="big">🎉 Done!</div><p>You have gone through all ${n} cards.</p>
      <button class="btn primary" id="again">Study again</button></div>`;
  } else {
    const w = words.find(x => x.id === st.ids[st.i]);
    const enHtml = `<div class="big">${esc(w.en)}</div>${w.ipa ? `<div class="ipa">${esc(w.ipa)}</div>` : ''}`;
    const viHtml = `<div class="${opt.dir === 'vi' ? 'big' : ''}">${esc(w.vi)}</div>`;
    const front = opt.dir === 'en' ? enHtml : viHtml;
    // Mặt sau thẻ: nghĩa (hoặc từ tiếng Anh) + câu ví dụ, dịch câu ví dụ (nút "Example" tắt thì không hiện câu ví dụ)
    const back = (opt.dir === 'en' ? viHtml : enHtml) + (w.type ? `<div>${typeTagHtml(w)}</div>` : '') + verbFormsHtml(w, 'div') +
      (opt.stEx && w.ex ? `<div class="ex" data-hl="${esc(w.ex)}">${hlHtml(w.ex)}</div>` : '') +
      (opt.stEx && w.exvi ? `<div class="exvi">${esc(w.exvi)}</div>` : '');
    body = `
      <p class="prog">${st.i + 1} / ${n}</p>
      <div class="card" id="card">
        ${front}
        ${st.flip ? `<div class="back">${back}</div>` : '<div class="hint">Tap the card to see the answer</div>'}
      </div>
      <div class="row row3">
        <button class="btn grow" id="say">🔊 Word</button>
        ${w.ex ? '<button class="btn grow" id="sayEx">🔈 Example</button>' : ''}
        <button class="btn grow ${w.learned ? 'primary' : ''}" id="learn">${w.learned ? '✓ Learned' : '○ Learned'}</button>
      </div>
      <div class="row">
        <button class="btn grow" id="prev" ${st.i ? '' : 'disabled'}>◀ Prev</button>
        <button class="btn grow primary" id="next">Next ▶</button>
      </div>
      <p class="muted" style="text-align:center">Swipe left / right on the card to change words</p>`;
    setTimeout(() => {
      const card = $('#card');
      card.onclick = e => {
        const nt = e.target.closest('.nt'); // chạm chữ đỏ: xem nghĩa, không lật thẻ
        if (nt) { showNote(nt.dataset.nt); return; }
        if (String(window.getSelection() || '').trim()) return; // đang bôi đen chữ: không lật thẻ
        st.flip = !st.flip;
        renderStudy(t, sub);
      };
      let x0 = null;
      card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      card.addEventListener('touchend', e => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (dx < -50) go(1);
        else if (dx > 50 && st.i > 0) go(-1);
      });
      $('#say').onclick = () => speak(w.en);
      if (w.ex) $('#sayEx').onclick = () => speak(w.ex);
      $('#learn').onclick = () => { w.learned = !w.learned; save(); renderStudy(t, sub); };
      $('#prev').onclick = () => go(-1);
      $('#next').onclick = () => go(1);
    });
  }
  app.className = tcClass(t);
  app.innerHTML = opts + body;
  bindExviChip();
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    opt[k] = k === 'dir' ? (opt.dir === 'en' ? 'vi' : 'en') : !opt[k];
    saveOpt();
    if (k === 'dir') st.flip = false;
    else if (k !== 'stEx') buildDeck(words, box.id); // ẩn / hiện câu ví dụ thì giữ nguyên thẻ đang học
    renderStudy(t, sub);
  });
  const again = $('#again');
  if (again) again.onclick = () => { buildDeck(words, box.id); renderStudy(t, sub); };

  function go(d) { st.i += d; st.flip = false; renderStudy(t, sub); }
}

// ===== Hội thoại: danh sách chủ đề =====
// Chế độ sắp xếp (nút ↕) giống màn hình Vocabulary
function renderConvHome() {
  const so = sorting === 'c';
  setBar('Conversation', '', so
    ? [['Done', 'Finish reordering', () => { sorting = null; renderConvHome(); }, 'text']]
    : [['↕', 'Reorder topics', () => { sorting = 'c'; renderConvHome(); }],
       ['🎧', 'Play all', () => { location.hash = 'cp'; }], ['＋', 'Add topic', addConvTopic]]);
