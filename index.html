<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MYEL">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MYEL</title>
<style>
/* Mẫu màu Ocean. --hd-*: thanh tiêu đề. --tc*: màu của từng chủ đề (tc0/tc1/tc2 luân phiên) */
:root{--bg:#f3f7fc;--card:#fff;--text:#1a1d24;--muted:#6b7280;--line:#e1e8f0;--pri:#185FA5;--danger:#dc2626;--ok:#16a34a;--chip:#E6F1FB;--hd-bg:#E6F1FB;--hd-text:#0C447C}
.tc0,:root{--tc:#378ADD;--tc-d:#185FA5;--tc-bg:#E6F1FB;--tc-e:#185FA5}
.tc1{--tc:#1D9E75;--tc-d:#0F6E56;--tc-bg:#E1F5EE;--tc-e:#0F6E56}
.tc2{--tc:#7F77DD;--tc-d:#534AB7;--tc-bg:#EEEDFE;--tc-e:#534AB7}
@media (prefers-color-scheme:dark){
:root{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--pri:#378ADD;--danger:#f87171;--ok:#22c55e;--chip:#0C447C;--hd-bg:#042C53;--hd-text:#B5D4F4}
.tc0,:root{--tc-d:#85B7EB;--tc-bg:#0C447C}
.tc1{--tc-d:#5DCAA5;--tc-bg:#085041}
.tc2{--tc-d:#AFA9EC;--tc-bg:#3C3489}}
/* Mẫu màu Sunset */
html[data-theme=sunset]{--bg:#fcf6f3;--pri:#D85A30;--chip:#FAECE7;--hd-bg:#FAECE7;--hd-text:#712B13}
html[data-theme=sunset],html[data-theme=sunset] .tc0{--tc:#D85A30;--tc-d:#993C1D;--tc-bg:#FAECE7;--tc-e:#993C1D}
html[data-theme=sunset] .tc1{--tc:#EF9F27;--tc-d:#854F0B;--tc-bg:#FAEEDA;--tc-e:#854F0B}
html[data-theme=sunset] .tc2{--tc:#D4537E;--tc-d:#993556;--tc-bg:#FBEAF0;--tc-e:#993556}
/* Mẫu màu Lavender */
html[data-theme=lavender]{--bg:#f6f5fd;--pri:#534AB7;--chip:#EEEDFE;--hd-bg:#EEEDFE;--hd-text:#3C3489}
html[data-theme=lavender],html[data-theme=lavender] .tc0{--tc:#7F77DD;--tc-d:#534AB7;--tc-bg:#EEEDFE;--tc-e:#534AB7}
html[data-theme=lavender] .tc1{--tc:#D4537E;--tc-d:#993556;--tc-bg:#FBEAF0;--tc-e:#993556}
html[data-theme=lavender] .tc2{--tc:#1D9E75;--tc-d:#0F6E56;--tc-bg:#E1F5EE;--tc-e:#0F6E56}
@media (prefers-color-scheme:dark){
html[data-theme=sunset]{--bg:#0f1115;--pri:#D85A30;--chip:#712B13;--hd-bg:#4A1B0C;--hd-text:#F5C4B3}
html[data-theme=sunset],html[data-theme=sunset] .tc0{--tc-d:#F0997B;--tc-bg:#712B13}
html[data-theme=sunset] .tc1{--tc-d:#FAC775;--tc-bg:#633806}
html[data-theme=sunset] .tc2{--tc-d:#ED93B1;--tc-bg:#72243E}
html[data-theme=lavender]{--bg:#0f1115;--pri:#7F77DD;--chip:#3C3489;--hd-bg:#26215C;--hd-text:#CECBF6}
html[data-theme=lavender],html[data-theme=lavender] .tc0{--tc-d:#AFA9EC;--tc-bg:#3C3489}
html[data-theme=lavender] .tc1{--tc-d:#ED93B1;--tc-bg:#72243E}
html[data-theme=lavender] .tc2{--tc-d:#5DCAA5;--tc-bg:#085041}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--hd-bg);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0 4px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hd-text)}
header .icon{color:var(--hd-text)}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon{background:none;border:0;font-size:22px;min-width:40px;height:40px;border-radius:10px;color:var(--pri);padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.icon.text{font-size:17px;font-weight:600}
.icon:disabled{opacity:.4}
#back{font-size:34px;line-height:1;padding-bottom:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.block{display:block;width:100%;margin:14px 0}
.row{display:flex;gap:10px;margin:10px 0}
.grow{flex:1;min-width:0}
.list{list-style:none;margin:10px 0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:8px;padding:12px 12px;color:inherit;text-decoration:none}
.item small{display:block;color:var(--muted);font-size:14px}
.topic{gap:14px;padding:10px 12px}
.thumb{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--tc);background:#fff;object-fit:cover;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--tc-e);font-weight:700;font-size:18px;letter-spacing:.5px}
.thumb.big{width:88px;height:88px;font-size:26px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;max-width:200px}
.bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
#words>li.item,#convs>li.item{border-left:4px solid var(--tc)}
.imgpick{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.imgpick .btns{display:flex;flex-direction:column;gap:8px}
.chev{color:var(--muted);font-size:22px}
.pen{color:var(--muted);font-size:15px}
.ipa{color:var(--muted);font-size:14px}
.ex{font-style:italic}
.chk{font-weight:700;color:var(--muted);opacity:.3}
.chk.on{opacity:1;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;list-style:none}
input,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-top:4px}
input[type=search]{margin:4px 0 0}
label,.label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
.label{margin-bottom:0}
.bad{border-color:var(--danger)}
select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);min-width:0}
[data-say]{cursor:pointer}
.ex .spk{font-style:normal;font-size:13px;margin-right:4px}
/* Các màn hình chiếm vừa 1 màn hình (danh sách cuộn bên trong) */
main.fill{display:flex;flex-direction:column;padding-bottom:12px;height:calc(100vh - var(--hh,57px) - env(safe-area-inset-bottom));height:calc(100dvh - var(--hh,57px) - env(safe-area-inset-bottom))}
.tlist{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0}
.fill .block{margin:12px 0 0}
/* Màn hình tổng */
.tiles{display:grid;gap:12px;margin-bottom:14px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--tc-bg);border:1px solid var(--tc);color:var(--tc-d);text-decoration:none}
.tile .ic{width:52px;height:52px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tile b{display:block;font-size:20px}
.tile small{font-size:14px}
.tile .chev{color:var(--tc-d)}
.banner{flex:1 1 0;min-height:120px;position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .ph{position:absolute;inset:0;width:100%;border:2px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-size:15px}
/* Khung kiểu A: bo góc lớn, viền theo màu mẫu, bóng đổ nhẹ. Trình chiếu trượt ngang + phóng to chậm */
.banner.framed{border:3px solid var(--pri);border-radius:22px;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.track{display:flex;height:100%;transition:transform .6s ease}
.track.jump{transition:none}
.slide{flex:0 0 100%;height:100%;overflow:hidden}
.slide img.zoom{animation:kb 4.6s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.6);box-shadow:0 0 3px rgba(0,0,0,.4);transition:width .3s}
.dot.on{width:20px;background:#fff}
/* Settings: danh sách ảnh màn hình tổng */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.tb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb button{position:absolute;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:0}
.tb .x{top:4px;right:4px}
.tb .l{bottom:4px;left:4px}
.tb .r{bottom:4px;right:4px}
/* Settings */
.sect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sect h3{margin:0 0 8px;font-size:16px}
.sect .row{margin:8px 0 0}
.vrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.vrow .vl{width:92px;font-size:14px;font-weight:600;flex:none}
/* Chủ đề ở chế độ sửa */
.tophead{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tophead .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* Màn hình nhập hội thoại (kiểu chat) */
.cerow{background:var(--card);border:1px solid var(--tc);border-left:4px solid var(--tc);border-radius:12px;padding:8px 10px;margin:8px 0}
.cerow.T{margin-right:24px}
.cerow.R{margin-left:24px}
.cetop{display:flex;align-items:center;gap:2px}
.who-btn{border:0;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;background:var(--tc-bg);color:var(--tc-d)}
.who-btn::after{content:" ⇄";font-weight:400}
.icon.sm{min-width:34px;height:34px;font-size:17px;color:var(--muted)}
.cerow textarea{margin-top:6px;resize:none;overflow:hidden;line-height:1.35}
.addrow .btn{border-color:var(--tc);color:var(--tc-d)}
/* Trình phát (Listen từ vựng, Conversation) */
.pl .plopts{margin:0 0 8px}
.plist{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.lshead{position:sticky;top:0;z-index:1;background:var(--tc-bg);color:var(--tc-d);font-weight:700;font-size:14px;padding:6px 14px}
.lshead small{font-weight:400;margin-left:6px}
.lsitem{padding:10px 14px;border-left:4px solid transparent;cursor:pointer}
.lsitem .en{font-size:20px;font-weight:700}
.lsitem .vi{color:var(--muted);font-size:14px}
.lsitem .ex{font-size:17px;margin-top:2px}
.lsitem.cur{background:var(--tc-bg);border-left-color:var(--tc)}
.ln{width:fit-content;max-width:85%;margin:8px 12px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--tc);cursor:pointer}
.ln.T{margin-right:auto;border-bottom-left-radius:4px}
.ln.R{margin-left:auto;border-bottom-right-radius:4px}
.ln .who{font-size:12px;font-weight:700;color:var(--tc-d);letter-spacing:.5px}
.ln .txt{font-size:17px}
.ln .vi{font-size:13px;color:var(--muted)}
.ln.cur{background:var(--tc-bg)}
.ln.you{border-style:dashed}
.ln.you .who::after{content:" · your turn";font-weight:400}
.reading{color:var(--tc-d)}
.reading.kara{color:var(--text)}
.sung{color:var(--tc-d)}
.lsbar{flex:none;padding-top:8px}
.lspos{align-items:center;margin:0}
.lspos span{font-size:14px;color:var(--muted);min-width:64px}
.lspos input{padding:0;border:0;background:none;margin:0}
.ctl{justify-content:center;align-items:center;gap:28px;margin:6px 0 0}
.ctl .play{width:60px;height:60px;border-radius:50%;background:var(--pri);color:#fff}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,440px);margin:calc(env(safe-area-inset-top) + 16px) auto auto;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:19px}
#dlgBtns{flex-wrap:wrap;justify-content:flex-end;margin:16px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--chip);border-color:var(--pri);color:var(--pri)}
.prog{text-align:center;color:var(--muted);margin:14px 0 0}
.card{background:var(--card);border:2px solid var(--tc);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;cursor:pointer}
.big{font-size:32px;font-weight:700;word-break:break-word}
.back{margin-top:16px;padding:14px;border-radius:14px;background:var(--tc-bg);width:100%;font-size:20px}
.back .ex{font-size:16px;color:var(--muted);margin-top:8px}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.row3{gap:8px}
.row3 .btn{padding:11px 6px;font-size:15px;white-space:nowrap}
.done{text-align:center;padding:40px 10px}
.done .big{margin-bottom:10px}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">MYEL</h1>
  <div id="actions"></div>
</header>
<main id="app"></main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="bannerIn" accept="image/*" multiple hidden>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'tuvung-data-v1';
const OPT_KEY = 'tuvung-study-v1';
const IMG_SIZE = 200;     // ảnh chủ đề: cắt vuông, thu nhỏ còn 200x200 (px)
const BANNER_SIZE = 900;  // ảnh màn hình tổng: cạnh dài tối đa 900px
const BANNER_MAX = 15;    // số ảnh màn hình tổng tối đa (dữ liệu lưu trong máy chỉ được khoảng 5MB)
const SLIDE_MS = 4000;    // thời gian chuyển ảnh
const THEMES = [['ocean', 'Ocean'], ['sunset', 'Sunset'], ['lavender', 'Lavender']];
const SPEAKER = { T: 'THAI', R: 'TRANG' };   // THAI: nam, TRANG: nữ
const CP_MODES = [['cont', 'Continuous'], ['shadow', 'Shadow'], ['T', 'Be THAI'], ['R', 'Be TRANG']];
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const ICON_PREV = '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>';
const ICON_NEXT = '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>';
const $ = s => document.querySelector(s);
const app = $('#app');

// ===== Dữ liệu =====
let db = load();
let opt = Object.assign({ dir: 'en', shuffle: false, onlyNew: false, lsRate: 0.9, cpRate: 0.9, cpMode: 'cont',
  theme: 'ocean', voiceV: '', voiceT: '', voiceR: '' }, readJSON(OPT_KEY));
document.documentElement.dataset.theme = opt.theme;
let st = null;          // trạng thái phiên học flashcard
let pl = null;          // trình phát đang mở (Listen từ vựng hoặc Conversation)
let editing = null;     // id chủ đề đang ở chế độ sửa (null = chế độ xem)
let ce = null;          // bản nháp khi nhập / sửa bài hội thoại

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function load() {
  const d = readJSON(KEY);
  if (d && Array.isArray(d.topics)) {
    if (!Array.isArray(d.conv)) d.conv = [sampleConv()]; // dữ liệu cũ chưa có phần hội thoại
    if (!Array.isArray(d.banners)) d.banners = isImg(d.banner) ? [d.banner] : []; // dữ liệu cũ: 1 ảnh → danh sách ảnh
    delete d.banner;
    return d;
  }
  // Lần đầu mở: tạo chủ đề ví dụ (có thể xóa)
  return { banners: [], conv: [sampleConv()], topics: [{ id: uid(), name: 'Family (example)', img: '', words: [
    { id: uid(), en: 'father', ipa: '/ˈfɑː.ðər/', vi: 'bố, cha', ex: 'My father is a teacher.', learned: false },
    { id: uid(), en: 'mother', ipa: '/ˈmʌð.ər/', vi: 'mẹ', ex: 'My mother cooks very well.', learned: false },
    { id: uid(), en: 'brother', ipa: '/ˈbrʌð.ər/', vi: 'anh trai, em trai', ex: 'I have one brother.', learned: false }
  ] }] };
}
function sampleConv() {
  return { id: uid(), name: 'Daily life (example)', img: '', items: [{ id: uid(), title: 'Weekend plans', lines: parseConv(
    'THAI: Hi Trang, do you have any plans for the weekend? | Chào Trang, cuối tuần này bạn có kế hoạch gì không?\n' +
    'TRANG: Not yet. I might stay home and read a book. | Chưa có. Có lẽ mình sẽ ở nhà đọc sách.\n' +
    'THAI: How about going to the park on Saturday morning? | Sáng thứ Bảy đi công viên thì sao?\n' +
    'TRANG: That sounds great. What time should we meet? | Nghe hay đấy. Mấy giờ mình gặp nhau?\n' +
    "THAI: Let's meet at eight, near the main gate. | Gặp lúc tám giờ, gần cổng chính nhé.\n" +
    'TRANG: OK, see you then! | Được, hẹn gặp lại!').lines }] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save data (storage may be full)'); return false; }
}
function saveOpt() {
  try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function topicById(id) { return db.topics.find(t => t.id === id); }
function convTopicById(id) { return db.conv.find(t => t.id === id); }
function tcClass(t, list) { return 'tc' + (Math.max((list || db.topics).indexOf(t), 0) % 3); } // màu của chủ đề (luân phiên 3 màu)
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function isImg(s) { return /^data:image\//.test(s || ''); }

// Bài hội thoại: mỗi dòng "THAI: câu | nghĩa" hoặc "TRANG: câu | nghĩa" (phần "| nghĩa" có hay không đều được)
function parseConv(text) {
  const lines = [];
  const rows = text.split(/\r?\n/);
  for (let n = 0; n < rows.length; n++) {
    const row = rows[n].trim();
    if (!row) continue;
    const m = row.match(/^(THAI|TRANG)\s*[:：]\s*(.*)$/i);
    if (!m) return { error: `Line ${n + 1} must start with "THAI:" or "TRANG:"\n\n${row}` };
    const bar = m[2].indexOf('|');
    const en = (bar < 0 ? m[2] : m[2].slice(0, bar)).trim();
    const vi = bar < 0 ? '' : m[2].slice(bar + 1).trim();
    if (!en) return { error: `Line ${n + 1}: the sentence is empty` };
    lines.push({ s: m[1].toUpperCase() === 'THAI' ? 'T' : 'R', en, vi });
  }
  if (!lines.length) return { error: 'Enter at least one line' };
  return { lines };
}
// Dán văn bản: mỗi dòng 1 câu. Dòng có "THAI:/TRANG:/T:/R:" ở đầu thì theo tên đó,
// dòng không có tên thì tự xen kẽ với người nói ở câu trước (prev: 'T' / 'R' / null).
function parseLoose(text, prev) {
  const rows = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const m = line.match(/^(THAI|TRANG|T|R)\s*[:：]\s*(.*)$/i);
    const s = m ? (/^(THAI|T)$/i.test(m[1]) ? 'T' : 'R') : (prev === 'T' ? 'R' : 'T');
    const body = m ? m[2] : line;
    const bar = body.indexOf('|');
    const en = (bar < 0 ? body : body.slice(0, bar)).trim();
    if (!en) return;
    rows.push({ s, en, vi: bar < 0 ? '' : body.slice(bar + 1).trim() });
    prev = s;
  });
  return rows;
}

function thumbHtml(img, cls) {

}

// Thu nhỏ ảnh, trả về JPEG (data URL)
// square = true: cắt phần vuông ở giữa, kích thước size x size
// square = false: giữ tỉ lệ, cạnh dài tối đa size
function resizeImage(file, size, square, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight, w, h;
      if (square) {
        const s = Math.min(sw, sh);
        sx = (sw - s) / 2;
        sy = (sh - s) / 2;
        sw = sh = s;
        w = h = size;
      } else {
        const k = Math.min(1, size / Math.max(sw, sh));
        w = Math.round(sw * k);
        h = Math.round(sh * k);
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality || 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// actions: [[nội dung nút, nhãn, hàm, class thêm], ...]
function setBar(title, backHash, actions) {
  $('#title').textContent = title;
  const b = $('#back');
  b.hidden = backHash == null;
  b.onclick = () => { location.hash = backHash; };
  const box = $('#actions');
  box.innerHTML = '';
  (actions || []).forEach(([text, label, fn, cls]) => {
    const btn = document.createElement('button');
    btn.className = 'icon ' + (cls || '');
    btn.textContent = text;
    btn.setAttribute('aria-label', label);
    btn.onclick = fn;
    box.appendChild(btn);
  });
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');
}

// Hộp thoại chung: trả về Promise {btn, v}
// fields: {name, label, required, en, multi, rows, ph, value, image}  (image: ô chọn ảnh chủ đề)
// buttons: {label, value, cls, check, run}  (run: chạy ngay khi bấm, ví dụ mở hộp chọn ảnh)
function ask({ title, msg, fields = [], buttons }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    const imgs = {}; // giá trị ảnh hiện tại của các ô chọn ảnh
    const finish = r => { d.oncancel = null; d.close(); resolve(r); };
    d.oncancel = e => { e.preventDefault(); finish({ btn: null, v: {} }); };
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = (msg ? `<p>${esc(msg)}</p>` : '') + fields.map(f => {
      if (f.image) {
        imgs[f.name] = f.value || '';
        return `<div class="label">${esc(f.label)}</div>
          <div class="imgpick" data-img="${f.name}">
            <span data-prev>${thumbHtml(imgs[f.name], 'big')}</span>
            <div class="btns">
              <button type="button" class="btn small" data-pick>Choose image</button>
              <button type="button" class="btn small danger" data-rm ${imgs[f.name] ? '' : 'hidden'}>Remove image</button>
            </div>
            <input type="file" accept="image/*" hidden>
          </div>`;
      }
      const attr = `name="${f.name}" placeholder="${esc(f.ph || '')}" autocomplete="off"` +
        (f.en ? ' autocapitalize="none" spellcheck="false" lang="en"' : '');
      const input = f.multi
        ? `<textarea ${attr} rows="${f.rows || 2}">${esc(f.value)}</textarea>`
        : `<input ${attr} value="${esc(f.value)}">`;
      return `<label>${esc(f.label)}${f.required ? ' *' : ''}${input}</label>`;
    }).join('');
    d.querySelectorAll('[data-img]').forEach(box => {
      const name = box.dataset.img;
      const file = box.querySelector('input[type=file]');
      const rm = box.querySelector('[data-rm]');
      const show = () => {
        box.querySelector('[data-prev]').innerHTML = thumbHtml(imgs[name], 'big');
        rm.hidden = !imgs[name];
      };
      box.querySelector('[data-pick]').onclick = () => file.click();
      rm.onclick = () => { imgs[name] = ''; show(); };
      file.onchange = async () => {
        const f = file.files[0];
        file.value = '';
        if (!f) return;
        try { imgs[name] = await resizeImage(f, IMG_SIZE, true); show(); }
        catch (e) { toast('Could not read this image'); }
      };
    });
    const box = $('#dlgBtns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => {
        const v = {};
        let bad = null;
        fields.forEach(f => {
          if (f.image) { v[f.name] = imgs[f.name]; return; }
          const el = d.querySelector(`[name="${f.name}"]`);
          v[f.name] = el.value.trim();
          el.classList.toggle('bad', !!(b.check && f.required && !v[f.name]));
          if (b.check && f.required && !v[f.name] && !bad) bad = el;
        });
        if (bad) { bad.focus(); toast('Please fill in the fields marked *'); return; }
        if (b.run) b.run();
        finish({ btn: b.value, v });
      };
      box.appendChild(btn);
    });
    d.showModal();
    const first = d.querySelector('input:not([type=file]),textarea');
    if (first) first.focus();
  });
}

// ===== Giọng đọc (giọng có sẵn trên máy, chạy offline) =====
// kind: 'V' từ vựng, 'T' THAI (nam), 'R' TRANG (nữ)
const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
const MALE = /(Evan|Nathan|Aaron|Tom\b|Alex\b|Fred|Daniel|Rishi|Gordon|Arthur|Oliver|Reed|Rocko|Eddy|Grandpa|Ralph|Junior|David|Mark|Guy|Andrew|Brian|Christopher|Eric|Roger|Davis|Tony|Jason)/i;
const FEMALE = /(Samantha|Ava|Zoe|Allison|Susan|Victoria|Nicky|Joelle|Noelle|Karen|Moira|Tessa|Kate|Serena|Martha|Catherine|Kathy|Flo\b|Sandy|Shelley|Grandma|Zira|Aria|Jenny|Michelle|Emma|Sara|Nancy|Amber|Ashley|Cora|Elizabeth|Monica|Google US English)/i;
function enVoices() {
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
}
function voiceScore(v) {
  return (/^en[-_]US/i.test(v.lang) ? 10 : 0) + (/premium/i.test(v.name) ? 3 : /enhanced/i.test(v.name) ? 2 : 0) + (/samantha/i.test(v.name) ? 1 : 0);
}
function bestVoice(re) {
  const vs = enVoices().filter(v => !re || re.test(v.name));
  vs.sort((a, b) => voiceScore(b) - voiceScore(a));
  return vs[0] || null;
}
// Trả về {v: giọng, pitch: cao độ}. Không có giọng nam thì THAI dùng giọng khác và chỉnh trầm xuống.
function voiceFor(kind) {
  const pref = { V: opt.voiceV, T: opt.voiceT, R: opt.voiceR }[kind];
  const chosen = pref && enVoices().find(v => v.name === pref);
  if (kind === 'V') return { v: chosen || bestVoice(null), pitch: 1 };
  if (kind === 'R') return { v: chosen || bestVoice(FEMALE) || bestVoice(null), pitch: 1 };
  const v = chosen || bestVoice(MALE);
  if (v && v !== voiceFor('R').v) return { v, pitch: 1 };
  return { v: v || bestVoice(null), pitch: 0.7 };
}
function makeUtter(text, kind, rate) {
  const u = new SpeechSynthesisUtterance(text);
  const { v, pitch } = voiceFor(kind);
  u.lang = v ? v.lang : 'en-US';
  if (v) u.voice = v;
  u.pitch = pitch;
  u.rate = rate;
  return u;
}
function speak(text, kind) {
  if (!('speechSynthesis' in window)) { toast('Speech is not supported on this device'); return; }
  speechSynthesis.cancel();
  speechSynthesis.speak(makeUtter(text, kind || 'V', 0.9));
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { if (location.hash === '#set') renderSettings(); };
}

// Tiếng "ting" nhẹ khi chuyển chủ đề / bài (tạo bằng Web Audio, không cần file âm thanh)
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function ding() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1320, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + 0.65);
}

// Giữ màn hình không tắt trong lúc phát (máy không hỗ trợ thì bỏ qua)
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}

// ''      màn hình tổng      | set  Settings

window.addEventListener('resize', () => document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px'));
function render() {
  const [page, id, id2] = location.hash.slice(1).split('/');
  const t = id && topicById(id);
  const ct = id && convTopicById(id);
  if (!((page === 't' || page === 'ct' || page === 'ce') && id === editing)) editing = null; // rời chủ đề thì trở về chế độ xem
  if (page !== 'l' && page !== 'cp' && pl) { plStop(); pl = null; }        // rời trình phát thì dừng đọc
  if (page !== 'ce') ce = null;                                            // rời màn hình nhập thì bỏ bản nháp
  clearInterval(slideTimer);                                               // dừng trình chiếu ảnh
  app.className = '';
  if (page === 'v') renderVocab();
  else if (page === 't' && t) renderTopic(t);
  else if (page === 's' && t) renderStudy(t);
  else if (page === 'l') renderListen(t ? t.id : '');
  else if (page === 'c') renderConvHome();
  else if (page === 'ct' && ct) renderConvTopic(ct);
  else if (page === 'ce' && ct && (id2 === 'new' || ct.items.some(c => c.id === id2))) renderConvEdit(ct, id2);
  else if (page === 'cp') renderConvPlay(ct ? (id2 && ct.items.some(c => c.id === id2) ? id + '/' + id2 : id) : '');
  else if (page === 'set') renderSettings();
  else renderHub();
  window.scrollTo(0, 0);
}

// ===== Trình chiếu ảnh màn hình tổng =====
// Ảnh cuối có thêm 1 bản sao của ảnh đầu, để từ ảnh cuối trượt tiếp sang ảnh đầu liền mạch.
let slideTimer = null;
function slidesHtml(imgs) {
  const list = imgs.length > 1 ? imgs.concat(imgs[0]) : imgs;
  return `<div class="banner framed" id="slides">
    <div class="track" id="track">${list.map(src => `<div class="slide"><img src="${esc(src)}" alt=""></div>`).join('')}</div>
    ${imgs.length > 1 ? `<div class="dots">${imgs.map((_, i) => `<button class="dot" data-d="${i}" aria-label="Image ${i + 1}"></button>`).join('')}</div>` : ''}
  </div>`;
}

function startSlides(n) {
  const track = $('#track');
  let pos = 0;
  const show = (to, animate) => {
    track.classList.toggle('jump', !animate);
    pos = to;
    track.style.transform = `translateX(${-pos * 100}%)`;
    document.querySelectorAll('#slides .dot').forEach((d, i) => d.classList.toggle('on', i === pos % n));
    const img = track.children[pos].querySelector('img'); // phóng to chậm ảnh đang hiện
    img.classList.remove('zoom');
    void img.offsetWidth;
    img.classList.add('zoom');
  };
  const next = () => {
    show(pos + 1, true);
    if (pos === n) setTimeout(() => { if (pos === n) show(0, false); }, 650); // tới bản sao ảnh đầu: nhảy về ảnh đầu thật
  };
  const prev = () => {
    if (pos === 0) { show(n, false); void track.offsetWidth; }
    show(pos - 1, true);
  };
  const restart = () => { clearInterval(slideTimer); if (n > 1) slideTimer = setInterval(next, SLIDE_MS); };
  show(0, false);
  restart();
  if (n < 2) return;
  const box = $('#slides');
  let x0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (dx < -40) { next(); restart(); }
    else if (dx > 40) { prev(); restart(); }
  });
  box.querySelectorAll('[data-d]').forEach(d => d.onclick = () => { show(+d.dataset.d, true); restart(); });
}

// Thêm ảnh màn hình tổng (chọn được nhiều ảnh cùng lúc)
$('#bannerIn').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  let added = 0;
  for (const f of files) {
    if (db.banners.length >= BANNER_MAX) { toast(`Up to ${BANNER_MAX} images`); break; }
    let img;
    try { img = await resizeImage(f, BANNER_SIZE, false, 0.75); }
    catch (err) { toast('Could not read an image'); continue; }
    db.banners.push(img);
    if (!save()) { db.banners.pop(); break; } // bộ nhớ đầy: save() đã báo
    added++;
  }
  if (added) toast(`Added ${added} image${added > 1 ? 's' : ''}`);
  render();
};

        <div class="grow"><b>${esc(t.name)}</b><small>${t.words.length} words · ${n} learned</small>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
        <span class="chev">›</span></a></li>`;
    }).join('') : '<li class="empty">No topics yet.</li>'}</ul>
    <button class="btn primary block" id="addT">＋ Add topic</button>`;
  $('#addT').onclick = addTopic;
}

function topicFields(t) {
  return [
    { name: 'name', label: 'Topic name', required: 1, ph: 'e.g. Food, Travel…', value: t && t.name },
    { name: 'img', label: 'Image', image: 1, value: t && t.img }
  ];
}

async function addTopic() {
  const r = await ask({
    title: 'Add topic',
    fields: topicFields(null),

  });

// ===== Từ vựng: màn hình chủ đề =====
// Chế độ xem: chỉ học (nghe, đánh dấu đã thuộc). Bấm ⚙ để vào chế độ sửa.
function renderTopic(t) {
  st = null;
  const ed = editing === t.id;
  setBar(t.name, 'v', [ed
    ? ['Done', 'Finish editing', () => { editing = null; renderTopic(t); }, 'text']
    : ['⚙', 'Edit topic', () => { editing = t.id; renderTopic(t); }]]);
  app.className = tcClass(t);
  app.innerHTML = `
    ${ed ? topHeadHtml(t) : ''}
    <div class="row">
      <button class="btn primary grow" id="study" ${t.words.length ? '' : 'disabled'}>▶ Study</button>
      ${ed ? '<button class="btn grow" id="addW">＋ Add word</button>'
           : `<button class="btn grow" id="listen" ${t.words.length ? '' : 'disabled'}>🎧 Listen</button>`}
    </div>
    ${ed && t.words.length ? '<p class="muted">Tap a word to edit or delete it.</p>' : ''}
    ${t.words.length > 5 ? '<input type="search" id="q" placeholder="Search…">' : ''}
    <ul class="list" id="words"></ul>`;
  $('#study').onclick = () => { location.hash = 's/' + t.id; };
  if (ed) {
    $('#addW').onclick = () => editWord(t, null);
    $('#editT').onclick = () => editTopic(t);
    $('#delT').onclick = () => deleteTopic(t, db.topics, 'words', 'v');
  } else {
    $('#listen').onclick = () => { location.hash = 'l/' + t.id; };
  }
  const q = $('#q');
  if (q) q.oninput = () => drawWords(t, q.value);
  $('#words').onclick = e => {
    const say = e.target.closest('[data-say]');
    const learn = e.target.closest('[data-learn]');
    const edit = e.target.closest('[data-edit]');
    if (say) speak(say.dataset.say);
    else if (learn) {
      const w = t.words.find(x => x.id === learn.dataset.learn);
      w.learned = !w.learned;
      save();
      learn.classList.toggle('on', w.learned);
    } else if (edit && editing === t.id) editWord(t, t.words.find(x => x.id === edit.dataset.edit));
  };
  drawWords(t, '');
}

function topHeadHtml(t) {
  return `<div class="tophead">${thumbHtml(t.img, 'big')}
    <div class="grow"><b>${esc(t.name)}</b>
      <div class="btns">
        <button class="btn small" id="editT">Edit topic</button>
        <button class="btn small danger" id="delT">Delete topic</button>
      </div>
    </div></div>`;
}

function drawWords(t, q) {
  const ed = editing === t.id;
  q = q.trim().toLowerCase();
  const ws = t.words.filter(w => !q || (w.en + ' ' + w.vi).toLowerCase().includes(q));
  $('#words').innerHTML = ws.length ? ws.map(w => `
    <li class="item">
      <button class="icon" data-say="${esc(w.en)}" aria-label="Pronounce">🔊</button>
      <div class="grow" ${ed ? `data-edit="${w.id}" style="cursor:pointer"` : ''}>
        <b ${ed ? '' : `data-say="${esc(w.en)}"`}>${esc(w.en)}</b> ${w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}
        <div>${esc(w.vi)}</div>
        ${w.ex ? `<small class="ex" ${ed ? '' : `data-say="${esc(w.ex)}"`}>${ed ? '' : '<span class="spk">🔈</span>'}${esc(w.ex)}</small>` : ''}
      </div>
      ${ed ? `<span class="pen" data-edit="${w.id}">✎</span>` : ''}
      <button class="icon chk ${w.learned ? 'on' : ''}" data-learn="${w.id}" aria-label="Learned">✓</button>
    </li>`).join('')
    : `<li class="empty">${t.words.length ? 'Not found.' : (ed ? 'No words yet. Tap “＋ Add word”.' : 'No words yet. Tap ⚙ to add words.')}</li>`;
}

// Dùng chung cho chủ đề từ vựng và chủ đề hội thoại
async function editTopic(t) {
  const r = await ask({
    title: 'Edit topic',
    fields: topicFields(t),
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  t.name = r.v.name;
  t.img = r.v.img;
  save();
  render();
}

// list: db.topics hoặc db.conv, child: tên mảng con ('words' / 'items'), backHash: màn hình quay về
function deleteTopic(t, list, child, backHash) {
  const n = t[child].length;
  if (!confirm(`Delete topic "${t.name}" and its ${n} ${child === 'words' ? 'words' : 'conversations'}?`)) return;
  list.splice(list.indexOf(t), 1);
  save();
  location.hash = backHash;
}

async function editWord(t, w) {
  const isNew = !w;
  const r = await ask({
    title: isNew ? 'Add word' : 'Edit word',
    fields: [
      { name: 'en', label: 'English word', required: 1, en: 1, value: w && w.en },
      { name: 'ipa', label: 'Pronunciation', en: 1, ph: '/ˈæp.əl/', value: w && w.ipa },
      { name: 'vi', label: 'Meaning', required: 1, value: w && w.vi },
      { name: 'ex', label: 'Example', multi: 1, en: 1, value: w && w.ex }
    ],
    buttons: isNew
      ? [{ label: 'Cancel', value: null }, { label: 'Save & add next', value: 'next', check: 1 }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
      : [{ label: 'Delete', value: 'del', cls: 'danger' }, { label: 'Cancel', value: null }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
  });
  if (r.btn === 'del') {
    if (confirm(`Delete "${w.en}"?`)) {
      t.words = t.words.filter(x => x !== w);
      save();
      render();
    }
    return;
  }
  if (!r.btn) return;
  if (isNew) {
    const dup = t.words.some(x => x.en.toLowerCase() === r.v.en.toLowerCase());
    if (dup && !confirm(`"${r.v.en}" already exists in this topic. Add anyway?`)) return;
    t.words.unshift(Object.assign({ id: uid(), learned: false }, r.v));
    toast('Added: ' + r.v.en);
  } else {
    Object.assign(w, r.v);
  }
  save();
  render();
  if (r.btn === 'next') editWord(t, null);
}

// ===== Học flashcard =====
function buildDeck(t) {
  const ids = t.words.filter(w => !opt.onlyNew || !w.learned).map(w => w.id);
  if (opt.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  }
  st = { tid: t.id, ids, i: 0, flip: false };
}

function renderStudy(t) {
  setBar('Study: ' + t.name, 't/' + t.id, []);
  if (!st || st.tid !== t.id) buildDeck(t);
  st.ids = st.ids.filter(id => t.words.some(w => w.id === id)); // bỏ từ đã bị xóa
  const opts = `
    <div class="opts">
      <button class="chip" data-o="dir">${opt.dir === 'en' ? 'EN → Meaning' : 'Meaning → EN'}</button>
      <button class="chip ${opt.shuffle ? 'on' : ''}" data-o="shuffle">Shuffle</button>
      <button class="chip ${opt.onlyNew ? 'on' : ''}" data-o="onlyNew">Not learned only</button>
    </div>`;
  const n = st.ids.length;
  let body;
  if (!n) {
    body = `<div class="done"><div class="big">🎉</div><p>${opt.onlyNew ? 'You have learned all the words in this topic!' : 'This topic has no words yet.'}</p></div>`;
  } else if (st.i >= n) {
    body = `<div class="done"><div class="big">🎉 Done!</div><p>You have gone through all ${n} cards.</p>
      <button class="btn primary" id="again">Study again</button></div>`;
  } else {
    const w = t.words.find(x => x.id === st.ids[st.i]);
    const enHtml = `<div class="big">${esc(w.en)}</div>${w.ipa ? `<div class="ipa">${esc(w.ipa)}</div>` : ''}`;
    const viHtml = `<div class="${opt.dir === 'vi' ? 'big' : ''}">${esc(w.vi)}</div>`;
    const front = opt.dir === 'en' ? enHtml : viHtml;
    const back = (opt.dir === 'en' ? viHtml : enHtml) + (w.ex ? `<div class="ex">${esc(w.ex)}</div>` : '');
    body = `
      <p class="prog">${st.i + 1} / ${n}</p>
      <div class="card" id="card">
        ${front}
        ${st.flip ? `<div class="back">${back}</div>` : '<div class="hint">Tap the card to see the answer</div>'}
      </div>
      <div class="row row3">
        <button class="btn grow" id="say">🔊 Word</button>
        ${w.ex ? '<button class="btn grow" id="sayEx">🔈 Example</button>' : ''}
        <button class="btn grow ${w.learned ? 'primary' : ''}" id="learn">${w.learned ? '✓ Learned' : '○ Learned'}</button>
      </div>
      <div class="row">
        <button class="btn grow" id="prev" ${st.i ? '' : 'disabled'}>◀ Prev</button>
        <button class="btn grow primary" id="next">Next ▶</button>
      </div>
      <p class="muted" style="text-align:center">Swipe left / right on the card to change words</p>`;
    setTimeout(() => {
      const card = $('#card');
      card.onclick = () => { st.flip = !st.flip; renderStudy(t); };
      let x0 = null;
      card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      card.addEventListener('touchend', e => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (dx < -50) go(1);
        else if (dx > 50 && st.i > 0) go(-1);
      });
      $('#say').onclick = () => speak(w.en);
      if (w.ex) $('#sayEx').onclick = () => speak(w.ex);
      $('#learn').onclick = () => { w.learned = !w.learned; save(); renderStudy(t); };
      $('#prev').onclick = () => go(-1);
      $('#next').onclick = () => go(1);
    });
  }
  app.className = tcClass(t);
  app.innerHTML = opts + body;
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    opt[k] = k === 'dir' ? (opt.dir === 'en' ? 'vi' : 'en') : !opt[k];
    saveOpt();
    if (k === 'dir') st.flip = false; else buildDeck(t);
    renderStudy(t);
  });
  const again = $('#again');
  if (again) again.onclick = () => { buildDeck(t); renderStudy(t); };

  function go(d) { st.i += d; st.flip = false; renderStudy(t); }
}

// ===== Hội thoại: màn hình nhập kiểu chat =====
// Mỗi câu 1 ô. Chạm tên để đổi THAI ⇄ TRANG. Enter: thêm câu tiếp theo cho người còn lại.
function renderConvEdit(t, cid) {
  const c = t.items.find(x => x.id === cid);
  if (!ce || ce.key !== t.id + '/' + cid) {
    ce = { key: t.id + '/' + cid, title: c ? c.title : '', dirty: false,
      rows: c ? c.lines.map(l => Object.assign({}, l)) : [{ s: 'T', en: '', vi: '' }] };
  }
  setBar(c ? 'Edit conversation' : 'New conversation', null, [['Save', 'Save', () => saveConvEdit(t, c), 'text']]);
  const back = $('#back');
  back.hidden = false;
  back.onclick = () => {
    if (ce && ce.dirty && !confirm('Discard your changes?')) return;
    location.hash = 'ct/' + t.id;
  };
  app.className = tcClass(t, db.conv);
  app.innerHTML = `
    <label>Title *<input id="ceTitle" value="${esc(ce.title)}" placeholder="e.g. At the cafe" autocomplete="off"></label>
    <div id="ceRows"></div>
    <div class="row addrow">
      <button class="btn grow tc0" id="ceAddT">＋ THAI</button>
      <button class="btn grow tc2" id="ceAddR">＋ TRANG</button>
    </div>
    <div class="row">
      <button class="btn grow" id="cePaste">Paste text</button>
      ${c ? '<button class="btn grow danger" id="ceDel">Delete</button>' : ''}
    </div>
    <p class="muted">Tap a name to switch THAI ⇄ TRANG. Press Return after a sentence to add the next one for the other person.</p>`;
  $('#ceTitle').oninput = e => { ce.title = e.target.value; ce.dirty = true; };
  $('#ceAddT').onclick = () => ceAdd('T', ce.rows.length);
  $('#ceAddR').onclick = () => ceAdd('R', ce.rows.length);
  $('#cePaste').onclick = cePaste;
  if (c) $('#ceDel').onclick = () => {
    if (!confirm(`Delete "${c.title}"?`)) return;
    t.items = t.items.filter(x => x !== c);
    save();
    location.hash = 'ct/' + t.id;
  };
  const box = $('#ceRows');
  box.oninput = e => {
    const row = e.target.closest('[data-i]');
    if (!row || !e.target.dataset.f) return;
    ce.rows[+row.dataset.i][e.target.dataset.f] = e.target.value;
    ce.dirty = true;
    fitHeight(e.target);
  };
  box.onkeydown = e => {
    if (e.key !== 'Enter' || e.isComposing || !e.target.dataset.f) return; // đang gõ bằng bộ gõ (IME) thì bỏ qua
    e.preventDefault();
    const i = +e.target.closest('[data-i]').dataset.i;
    ceAdd(ce.rows[i].s === 'T' ? 'R' : 'T', i + 1);
  };
  box.onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const i = +b.closest('[data-i]').dataset.i;
    const rows = ce.rows;
    if (b.dataset.act === 'sw') rows[i].s = rows[i].s === 'T' ? 'R' : 'T';
    else if (b.dataset.act === 'up' && i > 0) [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]];
    else if (b.dataset.act === 'down' && i < rows.length - 1) [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]];
    else if (b.dataset.act === 'del') rows.splice(i, 1);
    ce.dirty = true;
    ceDraw();
  };
  ceDraw();
}

function ceDraw(focus) {
  const n = ce.rows.length;
  $('#ceRows').innerHTML = ce.rows.map((r, i) => `
    <div class="cerow ${r.s} ${r.s === 'T' ? 'tc0' : 'tc2'}" data-i="${i}">
      <div class="cetop">
        <button class="who-btn" data-act="sw" aria-label="Switch speaker">${SPEAKER[r.s]}</button>
        <span class="grow"></span>
        <button class="icon sm" data-act="up" aria-label="Move up" ${i ? '' : 'disabled'}>↑</button>
        <button class="icon sm" data-act="down" aria-label="Move down" ${i < n - 1 ? '' : 'disabled'}>↓</button>
        <button class="icon sm" data-act="del" aria-label="Delete">✕</button>
      </div>
      <textarea data-f="en" rows="1" placeholder="Sentence" lang="en" autocomplete="off" enterkeyhint="next">${esc(r.en)}</textarea>
      <textarea data-f="vi" rows="1" placeholder="Meaning (optional)" autocomplete="off" enterkeyhint="next">${esc(r.vi)}</textarea>
    </div>`).join('');
  $('#ceRows').querySelectorAll('textarea').forEach(fitHeight);
  if (focus != null) {
    const el = document.querySelector(`#ceRows [data-i="${focus}"] [data-f="en"]`);
    if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
  }
}

// Ô nhập tự giãn chiều cao theo nội dung (câu dài xuống dòng, không bị che)
function fitHeight(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 2 + 'px';
}

function ceAdd(s, at) {
  ce.rows.splice(at, 0, { s, en: '', vi: '' });
  ce.dirty = true;
  ceDraw(at);
}

async function cePaste() {
  const r = await ask({
    title: 'Paste text',
    msg: 'One sentence per line. Lines without a name alternate between THAI and TRANG. ' +
      'To set the speaker, start a line with THAI: / TRANG: (or T: / R:). Add the meaning after |.',
    fields: [{ name: 'text', label: 'Text', required: 1, multi: 1, rows: 8,
      ph: "Hi, how are you?\nI'm fine, thanks. | Mình khỏe, cảm ơn." }],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  const kept = ce.rows.filter(x => x.en.trim() || x.vi.trim()); // bỏ các ô còn trống
  const rows = parseLoose(r.v.text, kept.length ? kept[kept.length - 1].s : null);
  if (!rows.length) { toast('No sentences found'); return; }
  ce.rows = kept.concat(rows);
  ce.dirty = true;
  ceDraw();
  toast(`Added ${rows.length} sentences`);
}

function saveConvEdit(t, c) {
  const title = ce.title.trim();
  if (!title) { $('#ceTitle').focus(); toast('Enter a title'); return; }
  const bad = ce.rows.findIndex(r => !r.en.trim() && r.vi.trim());
  if (bad >= 0) { ceDraw(bad); toast('This sentence is empty'); return; }
  const lines = ce.rows.filter(r => r.en.trim()).map(r => ({ s: r.s, en: r.en.trim(), vi: r.vi.trim() }));
  if (!lines.length) { toast('Add at least one sentence'); return; }
  if (c) { c.title = title; c.lines = lines; }
  else t.items.push({ id: uid(), title, lines });
  save();
  ce = null;
  location.hash = 'ct/' + t.id;
}

// ===== Trình phát dùng chung (Listen từ vựng, Conversation) =====
// pl = {kind, key, items, i, playing, done, resume, token, run}
// run(k, ok): đọc từ vị trí k, trả về true nếu đọc hết; ok() = false khi người dùng đã dừng / chuyển vị trí
function plStop() {
  if (!pl) return;
  pl.token++;
  pl.playing = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  keepAwake(false);
}

// Gọi trong thao tác bấm của người dùng để iPhone cho phép phát âm thanh
function plStart(k) {
  unlockAudio();
  plStop();
  if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
  const token = pl.token;
  const ok = () => !!pl && pl.token === token;
  pl.playing = true;
  keepAwake(true);
  plUpdate();
  pl.run(k, ok).then(finished => {
    if (!finished || !ok()) return;
    pl.playing = false;
    pl.done = true;
    keepAwake(false);
    plUpdate();
  });
}

function plRow(k) { return document.querySelector(`#plist [data-k="${k}"]`); }

// Đặt dòng đang đọc (nổi bật), trả dòng trước về như cũ
function plSetCur(k, scroll) {
  const prev = document.querySelector('#plist .cur');
  if (prev) {
    prev.classList.remove('cur');
    prev.querySelectorAll('[data-part]').forEach(p => { p.className = p.dataset.c; p.textContent = p.dataset.t; });
  }
  pl.i = k;
  pl.done = false;
  const el = plRow(k);
  if (!el) return;
  el.classList.add('cur');
  if (scroll) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function plUpdate() {
  const pos = $('#lsPos');
  if (!pos || !pl) return;
  const n = pl.items.length;
  pos.textContent = n ? `${pl.i + 1} / ${n}` : '0 / 0';
  $('#lsSeek').value = pl.i + 1;
  $('#lsPlay').innerHTML = pl.playing ? ICON_PAUSE : ICON_PLAY;
}

function plMove(d) {
  const k = Math.min(Math.max(pl.i + d, 0), pl.items.length - 1);
  if (pl.playing) plStart(k);
  else { plSetCur(k, true); plUpdate(); }
}

// Phần chữ được tô màu khi đọc (data-c: class gốc, data-t: chữ gốc để trả về như cũ)
function partHtml(cls, text) {
  return `<div class="${cls}" data-part data-c="${cls}" data-t="${esc(text)}">${esc(text)}</div>`;
}

function plBarHtml(n) {
  return `<div class="lsbar">
      <div class="row lspos">
        <span id="lsPos"></span>
        <input type="range" id="lsSeek" class="grow" min="1" max="${Math.max(n, 1)}" value="1" ${n ? '' : 'disabled'}>
      </div>
      <div class="row ctl">
        <button class="icon" id="lsPrev" aria-label="Previous" ${n ? '' : 'disabled'}>${ICON_PREV}</button>
        <button class="icon play" id="lsPlay" aria-label="Play / Pause" ${n ? '' : 'disabled'}></button>
        <button class="icon" id="lsNext" aria-label="Next" ${n ? '' : 'disabled'}>${ICON_NEXT}</button>
      </div>
    </div>`;
}

function plBind() {
  $('#plist').onclick = e => {
    const r = e.target.closest('[data-k]');
    if (r) plStart(+r.dataset.k);
  };
  const seek = $('#lsSeek');
  seek.oninput = () => {
    if (pl.playing) { pl.resume = true; plStop(); }
    plSetCur(seek.value - 1, true);
    plUpdate();
  };
  seek.onchange = () => {
    if (pl.resume) { pl.resume = false; plStart(pl.i); }
  };
  $('#lsPrev').onclick = () => plMove(-1);
  $('#lsNext').onclick = () => plMove(1);
  $('#lsPlay').onclick = () => {
    if (pl.playing) { plStop(); plUpdate(); }
    else plStart(pl.done ? 0 : pl.i);
  };
  if (pl.items.length) plSetCur(pl.i, false);
  plUpdate();
}

// Chờ ms mili giây; trả về false nếu trong lúc chờ người dùng đã dừng / chuyển vị trí
function waitFor(ms, ok) {
  return new Promise(r => setTimeout(() => r(ok()), ms));
}

// Đọc text bằng giọng kind, tô màu dần el theo chữ đang đọc
function sayInto(el, text, kind, rate, ok) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { toast('Speech is not supported on this device'); resolve(false); return; }
    let ended = false;
    let guard = null;
    const end = () => {
      if (ended) return;
      ended = true;
      clearTimeout(guard);
      if (el) { el.classList.remove('kara'); paint(el, text, text.length); }
      resolve(ok());
    };
    const u = makeUtter(text, kind, rate);
    // Máy gửi vị trí chữ đang đọc: tô màu đến chữ đó. Không gửi: tô màu cả dòng (class reading).
    u.onboundary = e => {
      if (!el || (e.name && e.name !== 'word')) return;
      let n = e.charIndex + (e.charLength || 0);
      if (!e.charLength) {
        const sp = text.indexOf(' ', e.charIndex);
        n = sp < 0 ? text.length : sp;
      }
      el.classList.add('kara');
      paint(el, text, n);
    };
    u.onend = end;
    u.onerror = end;
    if (el) el.classList.add('reading');
    guard = setTimeout(end, 4000 + text.length * 150 / rate); // phòng khi máy không báo đọc xong
    speechSynthesis.speak(u);
  });
}

function paint(el, text, n) {
  el.innerHTML = `<span class="sung">${esc(text.slice(0, n))}</span>${esc(text.slice(n))}`;
}

// App bị ẩn (khóa màn hình, chuyển app) thì iPhone ngừng đọc: dừng hẳn để trạng thái đúng
document.addEventListener('visibilitychange', () => {
  if (document.hidden && pl && pl.playing) { plStop(); plUpdate(); }
});

// ===== Listen: nghe tự động từ vựng (shadowing) =====
// Mỗi từ: đọc từ → nghỉ 1 giây → đọc câu ví dụ → nghỉ 3 giây → từ tiếp theo.
// Chuyển sang chủ đề khác thì kêu "ting". Đọc hết thì dừng.
function renderListen(scope) {
  setBar('Listen', scope ? 't/' + scope : 'v', []);
  if (!pl || pl.kind !== 'l' || pl.key !== scope) {
    if (pl) plStop();
    const items = [];
    db.topics.filter(t => !scope || t.id === scope).forEach(t => {
      t.words.forEach(w => items.push({ tid: t.id, tname: t.name, tc: tcClass(t), w }));
    });
    pl = { kind: 'l', key: scope, items, i: 0, playing: false, done: false, resume: false, token: 0, run: runVocab };
  }
  const n = pl.items.length;
  let last = null;
  app.className = 'fill pl';
  app.innerHTML = `
    <div class="row plopts">
      <select id="lsScope" class="grow" aria-label="Topics">
        <option value="">All topics</option>
        ${db.topics.map(t => `<option value="${t.id}" ${t.id === scope ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
      </select>
      <select id="lsRate" aria-label="Speed">
        ${[0.7, 0.9, 1].map(r => `<option value="${r}" ${r === opt.lsRate ? 'selected' : ''}>${r.toFixed(1)}x</option>`).join('')}
      </select>
    </div>
    <div class="plist" id="plist">${n ? pl.items.map((it, k) => {
      const head = it.tid !== last ? `<div class="lshead ${it.tc}">${esc(it.tname)}</div>` : '';
      last = it.tid;
      return head + `<div class="lsitem ${it.tc}" data-k="${k}">
        ${partHtml('en', it.w.en)}
        <div class="vi">${esc(it.w.vi)}</div>
        ${it.w.ex ? partHtml('ex', it.w.ex) : ''}
      </div>`;
    }).join('') : '<p class="empty">No words to listen to.</p>'}</div>
    ${plBarHtml(n)}`;
  $('#lsScope').onchange = e => { location.hash = e.target.value ? 'l/' + e.target.value : 'l'; };
  $('#lsRate').onchange = e => { opt.lsRate = parseFloat(e.target.value); saveOpt(); };
  plBind();
}

async function runVocab(k, ok) {
  for (let i = k; i < pl.items.length; i++) {
    const it = pl.items[i];
    if (i > k && pl.items[i - 1].tid !== it.tid) {
      ding();
      if (!await waitFor(800, ok)) return false;
    }
    plSetCur(i, true);
    plUpdate();
    const row = plRow(i);
    if (!await sayInto(row && row.querySelector('[data-c="en"]'), it.w.en, 'V', opt.lsRate, ok)) return false;
    if (it.w.ex) {
      if (!await waitFor(1000, ok)) return false;
      if (!await sayInto(row && row.querySelector('[data-c="ex"]'), it.w.ex, 'V', opt.lsRate, ok)) return false;
    }
    if (i < pl.items.length - 1 && !await waitFor(3000, ok)) return false;
  }
  return true;
}

// ===== Conversation: phát hội thoại =====
// key: '' tất cả | id chủ đề | id chủ đề/id bài
// Continuous: đọc liền (nghỉ 0.5 giây giữa các câu). Shadow: sau mỗi câu nghỉ bằng thời gian đọc câu đó + 1 giây.
// Be THAI / Be TRANG: app im lặng ở lượt của người đó để bạn tự nói. Chuyển sang bài khác thì kêu "ting".
function renderConvPlay(key) {
  const [tid, cid] = key ? key.split('/') : [];
  setBar('Conversation', tid ? 'ct/' + tid : 'c', []);
  if (!pl || pl.kind !== 'c' || pl.key !== key) {
    if (pl) plStop();
    const items = [];
    db.conv.filter(t => !tid || t.id === tid).forEach(t => {
      t.items.filter(c => !cid || c.id === cid).forEach(c => {
        c.lines.forEach(ln => items.push({ tname: t.name, cid: c.id, ctitle: c.title, tc: tcClass(t, db.conv), ln }));
      });
    });
    pl = { kind: 'c', key, items, i: 0, playing: false, done: false, resume: false, token: 0, run: runConv };
  }
  const n = pl.items.length;
  let last = null;
  app.className = 'fill pl';
  app.innerHTML = `
    <div class="row plopts">
      <select id="cpScope" class="grow" aria-label="Conversations">
        <option value="">All conversations</option>
        ${db.conv.map(t => `<optgroup label="${esc(t.name)}">
          <option value="${t.id}" ${key === t.id ? 'selected' : ''}>All in ${esc(t.name)}</option>
          ${t.items.map(c => `<option value="${t.id}/${c.id}" ${key === t.id + '/' + c.id ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}
        </optgroup>`).join('')}
      </select>
      <select id="cpRate" aria-label="Speed">
        ${[0.7, 0.9, 1].map(r => `<option value="${r}" ${r === opt.cpRate ? 'selected' : ''}>${r.toFixed(1)}x</option>`).join('')}
      </select>
    </div>
    <div class="opts">${CP_MODES.map(([v, l]) => `<button class="chip ${opt.cpMode === v ? 'on' : ''}" data-m="${v}">${l}</button>`).join('')}</div>
    <div class="plist" id="plist">${n ? pl.items.map((it, k) => {
      const head = it.cid !== last ? `<div class="lshead ${it.tc}">${esc(it.ctitle)}<small>${esc(it.tname)}</small></div>` : '';
      last = it.cid;
      const s = it.ln.s;
      return head + `<div class="ln ${s} ${s === 'T' ? 'tc0' : 'tc2'} ${opt.cpMode === s ? 'you' : ''}" data-k="${k}">
        <div class="who">${SPEAKER[s]}</div>
        ${partHtml('txt', it.ln.en)}
        ${it.ln.vi ? `<div class="vi">${esc(it.ln.vi)}</div>` : ''}
      </div>`;
    }).join('') : '<p class="empty">No conversations to play.</p>'}</div>
    ${plBarHtml(n)}`;
  $('#cpScope').onchange = e => { location.hash = e.target.value ? 'cp/' + e.target.value : 'cp'; };
  $('#cpRate').onchange = e => { opt.cpRate = parseFloat(e.target.value); saveOpt(); };
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    plStop();
    opt.cpMode = b.dataset.m;
    saveOpt();
    renderConvPlay(key);
  });
  plBind();
}

async function runConv(k, ok) {
  for (let i = k; i < pl.items.length; i++) {
    const it = pl.items[i];
    if (i > k && pl.items[i - 1].cid !== it.cid) {
      ding();
      if (!await waitFor(1000, ok)) return false;
    }
    plSetCur(i, true);
    plUpdate();
    const row = plRow(i);
    const t0 = Date.now();
    if (opt.cpMode === it.ln.s) {
      // Lượt của bạn (role-play): im lặng một khoảng ước tính theo độ dài câu
      if (!await waitFor(it.ln.en.split(/\s+/).length * 450 / opt.cpRate + 1500, ok)) return false;
    } else if (!await sayInto(row && row.querySelector('[data-part]'), it.ln.en, it.ln.s, opt.cpRate, ok)) return false;
    const gap = opt.cpMode === 'shadow' ? Date.now() - t0 + 1000 : 500;
    if (i < pl.items.length - 1 && !await waitFor(gap, ok)) return false;
  }
  return true;
}

// ===== Sao lưu / khôi phục =====
async function exportData() {
  const now = new Date();
  const ymd = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const name = 'MYEL-' + ymd + '.json';
  const text = JSON.stringify(db, null, 1);
  const blob = new Blob([text], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function normalize(d) {
  return (d.topics || []).filter(t => t && t.name).map(t => ({
    id: uid(),
    name: String(t.name),
    img: isImg(t.img) ? t.img : '',
    words: (Array.isArray(t.words) ? t.words : []).filter(w => w && w.en).map(w => ({
      id: uid(), en: String(w.en), ipa: String(w.ipa || ''), vi: String(w.vi || ''), ex: String(w.ex || ''), learned: !!w.learned
    }))
  }));
}

function normalizeConv(d) {
  return (Array.isArray(d.conv) ? d.conv : []).filter(t => t && t.name).map(t => ({
    id: uid(),
    name: String(t.name),
    img: isImg(t.img) ? t.img : '',
    items: (Array.isArray(t.items) ? t.items : []).filter(c => c && c.title && Array.isArray(c.lines)).map(c => ({
      id: uid(),
      title: String(c.title),
      lines: c.lines.filter(l => l && l.en).map(l => ({ s: l.s === 'T' ? 'T' : 'R', en: String(l.en), vi: String(l.vi || '') }))
    }))
  }));
}

$('#fileIn').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let topics, conv, banners;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.topics)) throw new Error();
    topics = normalize(d);
    conv = normalizeConv(d);
    // File sao lưu cũ có 1 ảnh (banner), file mới có danh sách ảnh (banners)
    banners = (Array.isArray(d.banners) ? d.banners : [d.banner]).filter(isImg).slice(0, BANNER_MAX);
  } catch (err) {
    toast('Invalid file');
    return;
  }
  const r = await ask({
    title: 'Import data',
    msg: `The file has ${topics.length} vocabulary topics (${topics.reduce((s, t) => s + t.words.length, 0)} words) and ` +
      `${conv.length} conversation topics (${conv.reduce((s, t) => s + t.items.length, 0)} conversations). What do you want to do?`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Replace all', value: 'rep', cls: 'danger' }, { label: 'Merge', value: 'merge', cls: 'primary' }]
  });
  if (r.btn === 'rep') {
    if (!confirm('All current data will be replaced by the data in the file. Continue?')) return;
    db = { banners, topics, conv };
  } else if (r.btn === 'merge') {
    banners.forEach(b => { if (db.banners.length < BANNER_MAX && !db.banners.includes(b)) db.banners.push(b); });
    topics.forEach(nt => {
      const t = db.topics.find(x => x.name.toLowerCase() === nt.name.toLowerCase());
      if (!t) { db.topics.push(nt); return; }
      if (!t.img && nt.img) t.img = nt.img;
      nt.words.forEach(w => {
        if (!t.words.some(x => x.en.toLowerCase() === w.en.toLowerCase())) t.words.push(w);
      });
    });
    conv.forEach(nt => {
      const t = db.conv.find(x => x.name.toLowerCase() === nt.name.toLowerCase());
      if (!t) { db.conv.push(nt); return; }
      if (!t.img && nt.img) t.img = nt.img;
      nt.items.forEach(c => {
        if (!t.items.some(x => x.title.toLowerCase() === c.title.toLowerCase())) t.items.push(c);
      });
    });
  } else return;
  save();
  toast('Data imported');
  location.hash = '';
  render();
};

// ===== Khởi động =====
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js');
}
render();
</script>
