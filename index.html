<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocabulary">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Vocabulary</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1a1d24;--muted:#6b7280;--line:#e3e7ef;--pri:#2563eb;--danger:#dc2626;--ok:#16a34a;--chip:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--pri:#3b82f6;--danger:#f87171;--ok:#22c55e;--chip:#1f2a44}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0 4px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon{background:none;border:0;font-size:22px;min-width:40px;height:40px;border-radius:10px;color:var(--pri);padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.icon.text{font-size:17px;font-weight:600}
#back{font-size:34px;line-height:1;padding-bottom:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.block{display:block;width:100%;margin:14px 0}
.row{display:flex;gap:10px;margin:10px 0}
.grow{flex:1;min-width:0}
.list{list-style:none;margin:10px 0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:8px;padding:12px 12px;color:inherit;text-decoration:none}
.item small{display:block;color:var(--muted);font-size:14px}
.topic{gap:14px;padding:10px 12px}
.thumb{flex:none;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;object-fit:cover;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#2563eb;font-weight:700;font-size:18px;letter-spacing:.5px}
.thumb.big{width:88px;height:88px;font-size:26px}
.imgpick{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.imgpick .btns{display:flex;flex-direction:column;gap:8px}
.chev{color:var(--muted);font-size:22px}
.pen{color:var(--muted);font-size:15px}
.ipa{color:var(--muted);font-size:14px}
.ex{font-style:italic}
.chk{font-weight:700;color:var(--muted);opacity:.3}
.chk.on{opacity:1;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;list-style:none}
input,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-top:4px}
input[type=search]{margin:4px 0 0}
label,.label{display:block;margin:10px 0;font-size:14px;color:var(--muted)}
.label{margin-bottom:0}
.bad{border-color:var(--danger)}
/* Màn hình chính: chiếm vừa 1 màn hình (danh sách chủ đề + nút + khung ảnh) */
main.fill{display:flex;flex-direction:column;padding-bottom:12px;height:calc(100vh - var(--hh,57px) - env(safe-area-inset-bottom));height:calc(100dvh - var(--hh,57px) - env(safe-area-inset-bottom))}
.tlist{flex:none;max-height:310px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0}
.fill .block{margin:12px 0}
.tools{align-items:center;margin:0 0 10px}
.tools .btn{padding:7px 16px;font-size:14px}
.expanded .tlist{flex:1;max-height:none}
.expanded .tools{margin:10px 0 0}
.expanded .hide-x{display:none!important}
.banner{flex:1;min-height:120px;position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .ph{position:absolute;inset:0;width:100%;border:2px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-size:15px}
.banner .cam{position:absolute;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
/* Chủ đề ở chế độ sửa */
.tophead{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tophead .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,440px);margin:calc(env(safe-area-inset-top) + 16px) auto auto;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:19px}
#dlgBtns{flex-wrap:wrap;justify-content:flex-end;margin:16px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--chip);border-color:var(--pri);color:var(--pri)}
.prog{text-align:center;color:var(--muted);margin:14px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;cursor:pointer}
.big{font-size:32px;font-weight:700;word-break:break-word}
.back{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);width:100%;font-size:20px}
.back .ex{font-size:16px;color:var(--muted);margin-top:8px}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.done{text-align:center;padding:40px 10px}
.done .big{margin-bottom:10px}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back">‹</button>
  <h1 id="title">Vocabulary</h1>
  <div id="actions"></div>
</header>
<main id="app"></main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="bannerIn" accept="image/*" hidden>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'tuvung-data-v1';
const OPT_KEY = 'tuvung-study-v1';
const IMG_SIZE = 200;     // ảnh chủ đề: cắt vuông, thu nhỏ còn 200x200 (px)
const BANNER_SIZE = 1000; // ảnh khung dưới màn hình chính: cạnh dài tối đa 1000px
const ICON_EXPAND = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const ICON_COLLAPSE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>';
const $ = s => document.querySelector(s);
const app = $('#app');

// ===== Dữ liệu =====
let db = load();
let opt = Object.assign({ dir: 'en', shuffle: false, onlyNew: false }, readJSON(OPT_KEY));
let st = null;          // trạng thái phiên học flashcard
let editing = null;     // id chủ đề đang ở chế độ sửa (null = chế độ xem)
let expanded = false;   // màn hình chính: chỉ hiện danh sách chủ đề

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function load() {
  const d = readJSON(KEY);
  if (d && Array.isArray(d.topics)) return d;
  // Lần đầu mở: tạo 1 chủ đề ví dụ (có thể xóa)
  return { banner: '', topics: [{ id: uid(), name: 'Family (example)', img: '', words: [
    { id: uid(), en: 'father', ipa: '/ˈfɑː.ðər/', vi: 'bố, cha', ex: 'My father is a teacher.', learned: false },
    { id: uid(), en: 'mother', ipa: '/ˈmʌð.ər/', vi: 'mẹ', ex: 'My mother cooks very well.', learned: false },
    { id: uid(), en: 'brother', ipa: '/ˈbrʌð.ər/', vi: 'anh trai, em trai', ex: 'I have one brother.', learned: false }
  ] }] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save data (storage may be full)'); return false; }
}
function saveOpt() {
  try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function topicById(id) { return db.topics.find(t => t.id === id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function isImg(s) { return /^data:image\//.test(s || ''); }

// ===== Ảnh =====
// Không có ảnh: hiện chữ "EL" trên nền trắng
function thumbHtml(img, cls) {
  return img
    ? `<img class="thumb ${cls || ''}" src="${esc(img)}" alt="">`
    : `<span class="thumb ${cls || ''}">EL</span>`;
}

// Thu nhỏ ảnh, trả về JPEG (data URL)
// square = true: cắt phần vuông ở giữa, kích thước size x size
// square = false: giữ tỉ lệ, cạnh dài tối đa size
function resizeImage(file, size, square) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight, w, h;
      if (square) {
        const s = Math.min(sw, sh);
        sx = (sw - s) / 2;
        sy = (sh - s) / 2;
        sw = sh = s;
        w = h = size;
      } else {
        const k = Math.min(1, size / Math.max(sw, sh));
        w = Math.round(sw * k);
        h = Math.round(sh * k);
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

// ===== Tiện ích giao diện =====
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// actions: [[nội dung nút, nhãn, hàm, class thêm], ...]
function setBar(title, backHash, actions) {
  $('#title').textContent = title;
  const b = $('#back');
  b.hidden = backHash == null;
  b.onclick = () => { location.hash = backHash; };
  const box = $('#actions');
  box.innerHTML = '';
  (actions || []).forEach(([text, label, fn, cls]) => {
    const btn = document.createElement('button');
    btn.className = 'icon ' + (cls || '');
    btn.textContent = text;
    btn.setAttribute('aria-label', label);
    btn.onclick = fn;
    box.appendChild(btn);
  });
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');
}

// Hộp thoại chung: trả về Promise {btn, v}
// fields: {name, label, required, en, multi, ph, value, image}  (image: ô chọn ảnh chủ đề)
function ask({ title, msg, fields = [], buttons }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    const imgs = {}; // giá trị ảnh hiện tại của các ô chọn ảnh
    const finish = r => { d.oncancel = null; d.close(); resolve(r); };
    d.oncancel = e => { e.preventDefault(); finish({ btn: null, v: {} }); };
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = (msg ? `<p>${esc(msg)}</p>` : '') + fields.map(f => {
      if (f.image) {
        imgs[f.name] = f.value || '';
        return `<div class="label">${esc(f.label)}</div>
          <div class="imgpick" data-img="${f.name}">
            <span data-prev>${thumbHtml(imgs[f.name], 'big')}</span>
            <div class="btns">
              <button type="button" class="btn small" data-pick>Choose image</button>
              <button type="button" class="btn small danger" data-rm ${imgs[f.name] ? '' : 'hidden'}>Remove image</button>
            </div>
            <input type="file" accept="image/*" hidden>
          </div>`;
      }
      const attr = `name="${f.name}" placeholder="${esc(f.ph || '')}" autocomplete="off"` +
        (f.en ? ' autocapitalize="none" spellcheck="false" lang="en"' : '');
      const input = f.multi
        ? `<textarea ${attr} rows="2">${esc(f.value)}</textarea>`
        : `<input ${attr} value="${esc(f.value)}">`;
      return `<label>${esc(f.label)}${f.required ? ' *' : ''}${input}</label>`;
    }).join('');
    d.querySelectorAll('[data-img]').forEach(box => {
      const name = box.dataset.img;
      const file = box.querySelector('input[type=file]');
      const rm = box.querySelector('[data-rm]');
      const show = () => {
        box.querySelector('[data-prev]').innerHTML = thumbHtml(imgs[name], 'big');
        rm.hidden = !imgs[name];
      };
      box.querySelector('[data-pick]').onclick = () => file.click();
      rm.onclick = () => { imgs[name] = ''; show(); };
      file.onchange = async () => {
        const f = file.files[0];
        file.value = '';
        if (!f) return;
        try { imgs[name] = await resizeImage(f, IMG_SIZE, true); show(); }
        catch (e) { toast('Could not read this image'); }
      };
    });
    const box = $('#dlgBtns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => {
        const v = {};
        let bad = null;
        fields.forEach(f => {
          if (f.image) { v[f.name] = imgs[f.name]; return; }
          const el = d.querySelector(`[name="${f.name}"]`);
          v[f.name] = el.value.trim();
          el.classList.toggle('bad', !!(b.check && f.required && !v[f.name]));
          if (b.check && f.required && !v[f.name] && !bad) bad = el;
        });
        if (bad) { bad.focus(); toast('Please fill in the fields marked *'); return; }
        finish({ btn: b.value, v });
      };
      box.appendChild(btn);
    });
    d.showModal();
    const first = d.querySelector('input:not([type=file]),textarea');
    if (first) first.focus();
  });
}

// ===== Phát âm (giọng đọc có sẵn trên máy, chạy offline) =====
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('Speech is not supported on this device'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.lang === 'en-US') || voices.find(x => /^en/.test(x.lang));
  if (v) u.voice = v;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ===== Điều hướng =====
window.addEventListener('hashchange', render);
window.addEventListener('resize', () => document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px'));
function render() {
  const [page, id] = location.hash.slice(1).split('/');
  const t = id && topicById(id);
  if (!(page === 't' && id === editing)) editing = null; // rời chủ đề thì trở về chế độ xem
  app.className = '';
  if (page === 't' && t) renderTopic(t);
  else if (page === 's' && t) renderStudy(t);
  else renderHome();
  window.scrollTo(0, 0);
}

// ===== Màn hình chính: danh sách chủ đề + khung ảnh =====
function renderHome() {
  st = null;
  setBar('Vocabulary', null, [['＋', 'Add topic', addTopic]]);
  app.className = 'fill' + (expanded ? ' expanded' : '');
  app.innerHTML = `
    <ul class="list tlist">${db.topics.length ? db.topics.map(t => {
      const n = t.words.filter(w => w.learned).length;
      return `<li><a class="item topic" href="#t/${t.id}">
        ${thumbHtml(t.img)}
        <div class="grow"><b>${esc(t.name)}</b><small>${t.words.length} words · ${n} learned</small></div>
        <span class="chev">›</span></a></li>`;
    }).join('') : '<li class="empty">No topics yet.</li>'}</ul>
    <button class="btn primary block hide-x" id="addT">＋ Add topic</button>
    <div class="row tools">
      <button class="btn hide-x" id="exp">Export</button>
      <button class="btn hide-x" id="imp">Import</button>
      <span class="grow"></span>
      <button class="icon" id="expand" aria-label="${expanded ? 'Show all' : 'Topics only'}">${expanded ? ICON_COLLAPSE : ICON_EXPAND}</button>
    </div>
    <div class="banner hide-x">${db.banner
      ? `<img src="${esc(db.banner)}" alt="">
         <button class="cam" id="bRm" style="right:52px" aria-label="Remove image">✕</button>
         <button class="cam" id="bPick" style="right:8px" aria-label="Change image">📷</button>`
      : '<button class="ph" id="bPick">＋ Add image</button>'}</div>`;
  $('#addT').onclick = addTopic;
  $('#exp').onclick = exportData;
  $('#imp').onclick = () => $('#fileIn').click();
  $('#expand').onclick = () => { expanded = !expanded; renderHome(); };
  $('#bPick').onclick = () => $('#bannerIn').click();
  const rm = $('#bRm');
  if (rm) rm.onclick = () => {
    if (!confirm('Remove this image?')) return;
    db.banner = '';
    save();
    renderHome();
  };
}

$('#bannerIn').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const old = db.banner;
  try { db.banner = await resizeImage(f, BANNER_SIZE, false); }
  catch (err) { toast('Could not read this image'); return; }
  if (!save()) db.banner = old;
  renderHome();
};

function topicFields(t) {
  return [
    { name: 'name', label: 'Topic name', required: 1, ph: 'e.g. Food, Travel…', value: t && t.name },
    { name: 'img', label: 'Image', image: 1, value: t && t.img }
  ];
}

async function addTopic() {
  const r = await ask({
    title: 'Add topic',
    fields: topicFields(null),
    buttons: [{ label: 'Cancel', value: null }, { label: 'Add', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  const t = { id: uid(), name: r.v.name, img: r.v.img, words: [] };
  db.topics.push(t);
  save();
  editing = t.id; // chủ đề mới: mở ở chế độ sửa để thêm từ ngay
  location.hash = 't/' + t.id;
}

// ===== Màn hình chủ đề: danh sách từ =====
// Chế độ xem: chỉ học (nghe, đánh dấu đã thuộc). Bấm ⚙ để vào chế độ sửa.
function renderTopic(t) {
  st = null;
  const ed = editing === t.id;
  setBar(t.name, '', [ed
    ? ['Done', 'Finish editing', () => { editing = null; renderTopic(t); }, 'text']
    : ['⚙', 'Edit topic', () => { editing = t.id; renderTopic(t); }]]);
  app.innerHTML = `
    ${ed ? `<div class="tophead">${thumbHtml(t.img, 'big')}
      <div class="grow"><b>${esc(t.name)}</b>
        <div class="btns">
          <button class="btn small" id="editT">Edit topic</button>
          <button class="btn small danger" id="delT">Delete topic</button>
        </div>
      </div></div>` : ''}
    <div class="row">
      <button class="btn primary grow" id="study" ${t.words.length ? '' : 'disabled'}>▶ Study</button>
      ${ed ? '<button class="btn grow" id="addW">＋ Add word</button>' : ''}
    </div>
    ${ed && t.words.length ? '<p class="muted">Tap a word to edit or delete it.</p>' : ''}
    ${t.words.length > 5 ? '<input type="search" id="q" placeholder="Search…">' : ''}
    <ul class="list" id="words"></ul>`;
  $('#study').onclick = () => { location.hash = 's/' + t.id; };
  if (ed) {
    $('#addW').onclick = () => editWord(t, null);
    $('#editT').onclick = () => editTopic(t);
    $('#delT').onclick = () => deleteTopic(t);
  }
  const q = $('#q');
  if (q) q.oninput = () => drawWords(t, q.value);
  $('#words').onclick = e => {
    const say = e.target.closest('[data-say]');
    const learn = e.target.closest('[data-learn]');
    const edit = e.target.closest('[data-edit]');
    if (say) speak(say.dataset.say);
    else if (learn) {
      const w = t.words.find(x => x.id === learn.dataset.learn);
      w.learned = !w.learned;
      save();
      learn.classList.toggle('on', w.learned);
    } else if (edit && editing === t.id) editWord(t, t.words.find(x => x.id === edit.dataset.edit));
  };
  drawWords(t, '');
}

function drawWords(t, q) {
  const ed = editing === t.id;
  q = q.trim().toLowerCase();
  const ws = t.words.filter(w => !q || (w.en + ' ' + w.vi).toLowerCase().includes(q));
  $('#words').innerHTML = ws.length ? ws.map(w => `
    <li class="item">
      <button class="icon" data-say="${esc(w.en)}" aria-label="Pronounce">🔊</button>
      <div class="grow" ${ed ? `data-edit="${w.id}" style="cursor:pointer"` : ''}>
        <b>${esc(w.en)}</b> ${w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}
        <div>${esc(w.vi)}</div>
        ${w.ex ? `<small class="ex">${esc(w.ex)}</small>` : ''}
      </div>
      ${ed ? `<span class="pen" data-edit="${w.id}">✎</span>` : ''}
      <button class="icon chk ${w.learned ? 'on' : ''}" data-learn="${w.id}" aria-label="Learned">✓</button>
    </li>`).join('')
    : `<li class="empty">${t.words.length ? 'Not found.' : (ed ? 'No words yet. Tap “＋ Add word”.' : 'No words yet. Tap ⚙ to add words.')}</li>`;
}

async function editTopic(t) {
  const r = await ask({
    title: 'Edit topic',
    fields: topicFields(t),
    buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: 'ok', check: 1, cls: 'primary' }]
  });
  if (!r.btn) return;
  t.name = r.v.name;
  t.img = r.v.img;
  save();
  render();
}

function deleteTopic(t) {
  if (!confirm(`Delete topic "${t.name}" and its ${t.words.length} words?`)) return;
  db.topics = db.topics.filter(x => x !== t);
  save();
  location.hash = '';
}

async function editWord(t, w) {
  const isNew = !w;
  const r = await ask({
    title: isNew ? 'Add word' : 'Edit word',
    fields: [
      { name: 'en', label: 'English word', required: 1, en: 1, value: w && w.en },
      { name: 'ipa', label: 'Pronunciation', en: 1, ph: '/ˈæp.əl/', value: w && w.ipa },
      { name: 'vi', label: 'Meaning', required: 1, value: w && w.vi },
      { name: 'ex', label: 'Example', multi: 1, en: 1, value: w && w.ex }
    ],
    buttons: isNew
      ? [{ label: 'Cancel', value: null }, { label: 'Save & add next', value: 'next', check: 1 }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
      : [{ label: 'Delete', value: 'del', cls: 'danger' }, { label: 'Cancel', value: null }, { label: 'Save', value: 'save', check: 1, cls: 'primary' }]
  });
  if (r.btn === 'del') {
    if (confirm(`Delete "${w.en}"?`)) {
      t.words = t.words.filter(x => x !== w);
      save();
      render();
    }
    return;
  }
  if (!r.btn) return;
  if (isNew) {
    const dup = t.words.some(x => x.en.toLowerCase() === r.v.en.toLowerCase());
    if (dup && !confirm(`"${r.v.en}" already exists in this topic. Add anyway?`)) return;
    t.words.unshift(Object.assign({ id: uid(), learned: false }, r.v));
    toast('Added: ' + r.v.en);
  } else {
    Object.assign(w, r.v);
  }
  save();
  render();
  if (r.btn === 'next') editWord(t, null);
}

// ===== Học flashcard =====
function buildDeck(t) {
  const ids = t.words.filter(w => !opt.onlyNew || !w.learned).map(w => w.id);
  if (opt.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  }
  st = { tid: t.id, ids, i: 0, flip: false };
}

function renderStudy(t) {
  setBar('Study: ' + t.name, 't/' + t.id, []);
  if (!st || st.tid !== t.id) buildDeck(t);
  st.ids = st.ids.filter(id => t.words.some(w => w.id === id)); // bỏ từ đã bị xóa
  const opts = `
    <div class="opts">
      <button class="chip" data-o="dir">${opt.dir === 'en' ? 'EN → Meaning' : 'Meaning → EN'}</button>
      <button class="chip ${opt.shuffle ? 'on' : ''}" data-o="shuffle">Shuffle</button>
      <button class="chip ${opt.onlyNew ? 'on' : ''}" data-o="onlyNew">Not learned only</button>
    </div>`;
  const n = st.ids.length;
  let body;
  if (!n) {
    body = `<div class="done"><div class="big">🎉</div><p>${opt.onlyNew ? 'You have learned all the words in this topic!' : 'This topic has no words yet.'}</p></div>`;
  } else if (st.i >= n) {
    body = `<div class="done"><div class="big">🎉 Done!</div><p>You have gone through all ${n} cards.</p>
      <button class="btn primary" id="again">Study again</button></div>`;
  } else {
    const w = t.words.find(x => x.id === st.ids[st.i]);
    const enHtml = `<div class="big">${esc(w.en)}</div>${w.ipa ? `<div class="ipa">${esc(w.ipa)}</div>` : ''}`;
    const viHtml = `<div class="${opt.dir === 'vi' ? 'big' : ''}">${esc(w.vi)}</div>`;
    const front = opt.dir === 'en' ? enHtml : viHtml;
    const back = (opt.dir === 'en' ? viHtml : enHtml) + (w.ex ? `<div class="ex">${esc(w.ex)}</div>` : '');
    body = `
      <p class="prog">${st.i + 1} / ${n}</p>
      <div class="card" id="card">
        ${front}
        ${st.flip ? `<div class="back">${back}</div>` : '<div class="hint">Tap the card to see the answer</div>'}
      </div>
      <div class="row">
        <button class="btn grow" id="say">🔊 Listen</button>
        <button class="btn grow ${w.learned ? 'primary' : ''}" id="learn">${w.learned ? '✓ Learned' : '○ Learned'}</button>
      </div>
      <div class="row">
        <button class="btn grow" id="prev" ${st.i ? '' : 'disabled'}>◀ Prev</button>
        <button class="btn grow primary" id="next">Next ▶</button>
      </div>
      <p class="muted" style="text-align:center">Swipe left / right on the card to change words</p>`;
    setTimeout(() => {
      const card = $('#card');
      card.onclick = () => { st.flip = !st.flip; renderStudy(t); };
      let x0 = null;
      card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      card.addEventListener('touchend', e => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0;
        x0 = null;
        if (dx < -50) go(1);
        else if (dx > 50 && st.i > 0) go(-1);
      });
      $('#say').onclick = () => speak(w.en);
      $('#learn').onclick = () => { w.learned = !w.learned; save(); renderStudy(t); };
      $('#prev').onclick = () => go(-1);
      $('#next').onclick = () => go(1);
    });
  }
  app.innerHTML = opts + body;
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    opt[k] = k === 'dir' ? (opt.dir === 'en' ? 'vi' : 'en') : !opt[k];
    saveOpt();
    if (k === 'dir') st.flip = false; else buildDeck(t);
    renderStudy(t);
  });
  const again = $('#again');
  if (again) again.onclick = () => { buildDeck(t); renderStudy(t); };

  function go(d) { st.i += d; st.flip = false; renderStudy(t); }
}

// ===== Sao lưu / khôi phục =====
async function exportData() {
  const now = new Date();
  const ymd = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const name = 'MYEL-' + ymd + '.json';
  const text = JSON.stringify(db, null, 1);
  const blob = new Blob([text], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function normalize(d) {
  return (d.topics || []).filter(t => t && t.name).map(t => ({
    id: uid(),
    name: String(t.name),
    img: isImg(t.img) ? t.img : '',
    words: (Array.isArray(t.words) ? t.words : []).filter(w => w && w.en).map(w => ({
      id: uid(), en: String(w.en), ipa: String(w.ipa || ''), vi: String(w.vi || ''), ex: String(w.ex || ''), learned: !!w.learned
    }))
  }));
}

$('#fileIn').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let topics, banner;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.topics)) throw new Error();
    topics = normalize(d);
    banner = isImg(d.banner) ? d.banner : '';
  } catch (err) {
    toast('Invalid file');
    return;
  }
  const r = await ask({
    title: 'Import data',
    msg: `The file has ${topics.length} topics, ${topics.reduce((s, t) => s + t.words.length, 0)} words. What do you want to do?`,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Replace all', value: 'rep', cls: 'danger' }, { label: 'Merge', value: 'merge', cls: 'primary' }]
  });
  if (r.btn === 'rep') {
    if (!confirm('All current data will be replaced by the data in the file. Continue?')) return;
    db = { banner, topics };
  } else if (r.btn === 'merge') {
    if (!db.banner && banner) db.banner = banner;
    topics.forEach(nt => {
      const t = db.topics.find(x => x.name.toLowerCase() === nt.name.toLowerCase());
      if (!t) { db.topics.push(nt); return; }
      if (!t.img && nt.img) t.img = nt.img;
      nt.words.forEach(w => {
        if (!t.words.some(x => x.en.toLowerCase() === w.en.toLowerCase())) t.words.push(w);
      });
    });
  } else return;
  save();
  toast('Data imported');
  location.hash = '';
  render();
};

// ===== Khởi động =====
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js');
}
render();
</script>
